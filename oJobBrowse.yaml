    // Declare supported browse capabilities
    exports.capabilities = {
      contract: 1,
      query: 1,
      previewFormats: 1,
      boundedPreview: 1,
      operations: 1,
      prefetch: 1
    }

    // Report request errors
    exports.error = function(status, message) {
      var e = new Error(message)
      e.httpStatus = status
      throw e
