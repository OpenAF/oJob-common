      if (options.preview && isMap(options.preview.formats)) required.push("previewFormats")
      if (options.preview && isDef(options.preview.maxBytes)) required.push("boundedPreview")
      if (options.operations && options.operations.enabled) required.push("operations")
      required.forEach(function(key) {
        if (!capabilities || capabilities[key] !== 1) throw new Error("Browse capability " + key + " requires an updated browse implementation")
      })

      // Validate query and preview limits
      var limits = {
        pageSize: 500,
        maxPageSize: 500,
        maxScanned: 1000000,
        maxResults: 1000,
        maxQueryLength: 4096,
        timeoutMs: 60000
      }
      if (options.query) Object.keys(limits).forEach(function(key) {
        var n = options.query[key]
        if (isDef(n) && (!isNumber(n) || !isFinite(n) || n < 1 || Math.floor(n) != n || n > limits[key])) exports.error(400, "Invalid query option " + key)
      })
      if (options.preview && isDef(options.preview.maxBytes)) {
        var n = options.preview.maxBytes
        if (!isNumber(n) || !isFinite(n) || n < 1 || Math.floor(n) != n || n > 16777216) exports.error(400, "Invalid preview.maxBytes")
      }
      if (options.preview && isMap(options.preview.formats)) Object.keys(options.preview.formats).forEach(function(k) {
        if (!/^(name:.+|[a-z0-9]+)$/.test(k) || !isString(options.preview.formats[k]) || !/^[a-z][a-z0-9-]*$/.test(options.preview.formats[k])) exports.error(400, "Invalid preview format")
