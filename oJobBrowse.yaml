- name : HTTP Browse API
  deps :
  - HTTP Start Server
  to   : HTTP Service
  typeArgs:
    noLog: false
    shortcut:
      name  : httpdBrowserAPI
      keyArg: port
      args  :
        uri       : uri
        browseUri : browseUri
        operationsBrowseUris: operationsBrowseUris
  help :
   text   : Provides a HTTP API to access getList/getObj for any HTTP Browse generic implementation.
   expects:
   - name: port
     desc: (Number) The port where the server was made available (default is 8091)
   - name: uri
     desc: (String) The URI where the HTTP Browser API will be available.
   - name: browseUri
     desc: (String) The HTTP Browse generic URI to target (can be overridden by request param browseUri)
  check:
    in:
      port      : toNumber.isNumber.default(8091)
      uri       : isString.default("/api/browse")
      browseUri : isString.default(__)
  args :
    execURI: | #js
      try {
        var _cfg    = _$((global.__GBHTTPDAPI || {})[String(port) + uri], "apiCfg").isMap().default({})
        var _params = _$(request.params).isMap().default({})

        var targetUri = _params.browseUri
        if (isUnDef(targetUri) || targetUri === "") targetUri = _cfg.browseUri
        if (isUnDef(targetUri) || targetUri === "") targetUri = _params.uri
        if (isUnDef(targetUri) || targetUri === "") {
          return { data: "Missing browseUri", mimetype: "text/plain", status: 400, header: {} }
        }

        var _options = (global.__GBHTTPD || {})[String(port) + targetUri]
        if (isUnDef(_options)) {
          return { data: "Unknown browseUri", mimetype: "text/plain", status: 404, header: {} }
        }

        // Check requested capabilities
        if (_cfg.requiredOptions) {
          try {
            require("ojob-browse-contract.js").check(_cfg.requiredOptions, _options.capabilities)
          } catch (e) {
            return ow.server.httpd.reply({
              error: "Target browser lacks the requested capability"
            }, 501, "application/json", {})
          }
        }

        var targetPath = _$(_params.path).isString().default("")
        var _req = {}
        Object.keys(request).forEach(k => _req[k] = request[k])
        _req.params = _params
        _req.uri    = (targetUri + "/" + targetPath.replace(/^\/+/, "")).replace(/\/{2,}/g, "/").replace(/\/$/, "") || "/"

        var action = _$(_params.action).isString().default("list")

        // Dispatch API operations
        if (["status", "freshness", "refresh", "metrics"].indexOf(action) >= 0) {
          if (!isArray(_cfg.operationsBrowseUris) || _cfg.operationsBrowseUris.indexOf(targetUri) < 0) return ow.server.httpd.reply({
            error: "Operation target not authorized"
          }, 403, "application/json", {})
          if (!_options._operation) return ow.server.httpd.reply({
            error: "Operations not supported"
          }, 501, "application/json", {})
          return _options._operation(action, _req, server, true)
        }
        if (action == "preview") {
          if (!_options.capabilities || !_options.capabilities.previewFormats) return ow.server.httpd.reply({
            error: "Preview not supported"
          }, 501, "application/json", {})
          return _options._fns.renderObj(_options._fns.getObj(_req, Object.assign({}, _options, {
            _api: false
          })), server, _req, _options)
        }

        if (action == "obj") {
          var _obj = _options._fns.getObj(_req, merge(_options, { _api: true }))
          //if (request.params.raw == "true") {
            if (isDef(_obj.stream)) return server.replyStream(_obj.stream, ow.server.httpd.getMimeType(targetPath))
            if (isDef(_obj.file)) return server.replyStream(io.readFileStream(_obj.file), ow.server.httpd.getMimeType(targetPath))
            if (isDef(_obj.data)) return ow.server.httpd.reply(_obj.data)
          //}
          return ow.server.httpd.reply(_obj)
        }

        if (action == "search") {
          if (isUnDef(_options._fns) || isUnDef(_options._fns.search)) {
            return ow.server.httpd.reply({ error: "Search not supported", browseUri: targetUri }, 501, "application/json", {})
          }
          var _res = _options._fns.search(_req, merge(_options, { _api: true }))
          if (!isArray(_res.list)) _res.list = []
          return ow.server.httpd.reply(_res)
        }

        var _lst = _options._fns.getList(_req, merge(_options, { _api: true }))
        if (!_lst.isList) {
          if (_lst.isFile) return ow.server.httpd.reply({ error: "Not a list", isFile: true, path: targetPath }, 400, "application/json", {})
          return ow.server.httpd.reply({ error: "Not found", path: targetPath }, 404, "application/json", {})
        }
        if (!isArray(_lst.list)) _lst.list = []
        return ow.server.httpd.reply(_lst)
      } catch(e) {
        if (e.httpStatus == 403) return { data: "Forbidden", mimetype: "text/plain", status: 403, header: {} }
        if ([400, 404, 405, 501, 503].indexOf(e.httpStatus) >= 0) return {
          data: "Browse request rejected",
          mimetype: "text/plain",
          status: e.httpStatus,
          header: {}
