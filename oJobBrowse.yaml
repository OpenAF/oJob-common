include:
- oJobHTTPd.yaml

code:
  ojob-browse-contract.js: |

    // Declare supported browse capabilities
    exports.capabilities = {
      contract: 1,
      query: 1,
      previewFormats: 1,
      boundedPreview: 1,
      operations: 1
    }

    // Report request errors
    exports.error = function(status, message) {
      var e = new Error(message)
      e.httpStatus = status
      throw e
    }

    // Validate provider capabilities and options
    exports.check = function(options, capabilities) {
      // Check the capabilities required by the selected options
      options = options || {}
      var required = []
      if (options.query && options.query.enabled) required.push("query")
      if (options.preview && isMap(options.preview.formats)) required.push("previewFormats")
      if (options.preview && isDef(options.preview.maxBytes)) required.push("boundedPreview")
      if (options.operations && options.operations.enabled) required.push("operations")
      required.forEach(function(key) {
        if (!capabilities || capabilities[key] !== 1) throw new Error("Browse capability " + key + " requires an updated browse implementation")
      })

      // Validate query and preview limits
      var limits = {
        pageSize: 500,
        maxPageSize: 500,
        maxScanned: 1000000,
        maxResults: 1000,
        maxQueryLength: 4096,
        timeoutMs: 60000
      }
      if (options.query) Object.keys(limits).forEach(function(key) {
        var n = options.query[key]
        if (isDef(n) && (!isNumber(n) || !isFinite(n) || n < 1 || Math.floor(n) != n || n > limits[key])) exports.error(400, "Invalid query option " + key)
      })
      if (options.preview && isDef(options.preview.maxBytes)) {
        var n = options.preview.maxBytes
        if (!isNumber(n) || !isFinite(n) || n < 1 || Math.floor(n) != n || n > 16777216) exports.error(400, "Invalid preview.maxBytes")
      }
      if (options.preview && isMap(options.preview.formats)) Object.keys(options.preview.formats).forEach(function(k) {
        if (!/^(name:.+|[a-z0-9]+)$/.test(k) || !isString(options.preview.formats[k]) || !/^[a-z][a-z0-9-]*$/.test(options.preview.formats[k])) exports.error(400, "Invalid preview format")
      })
    }

    // Sort and paginate provider results
    exports.query = function(result, request, options) {
      if (!result.isList || !options.query || !options.query.enabled || result.queryInfo && result.queryInfo.applied) return result
      if (result.pageInfo && result.pageInfo.pageSize > 0) exports.error(501, "Provider must query before pagination")
      var p = request.params || {},
        c = options.query
      var integer = function(value, fallback, max) {
        var n = Number(isDef(value) ? value : fallback)
        if (!isFinite(n) || n < 1 || Math.floor(n) != n || n > max) exports.error(400, "Invalid browse integer")
        return n
      }
      var size = integer(isDef(p.size) ? p.size : p.pageSize, c.pageSize || 100, c.maxPageSize || 500)
      var page = integer(p.page, 1, 9007199254740991),
        key = String(result.key)
      var field = p.sort || key,
        order = p.order || "asc"
      if (result.fields.indexOf(field) < 0 || ["asc", "desc"].indexOf(order) < 0) exports.error(400, "Invalid sort")

      // Sort directories and field values
      var rows = result.list.slice()
      rows.sort(function(a, b) {
        if (!!a.isDirectory != !!b.isDirectory) return a.isDirectory ? -1 : 1
        var av = a.sortValues && isDef(a.sortValues[field]) ? a.sortValues[field] : a.values[field]
        var bv = b.sortValues && isDef(b.sortValues[field]) ? b.sortValues[field] : b.values[field]
        if (field == "Size" && isNumber(a.values["Size in bytes"]) && isNumber(b.values["Size in bytes"])) {
          av = a.values["Size in bytes"]
          bv = b.values["Size in bytes"]
        }
        var n = isNumber(av) && isNumber(bv) ? av - bv : String(av).localeCompare(String(bv))
        return n ? n * (order == "desc" ? -1 : 1) : String(a.values[key]).localeCompare(String(b.values[key]))
      })

      // Build pagination metadata
      var total = rows.length,
        pages = Math.max(1, Math.ceil(total / size))
      page = Math.min(page, pages)
      return Object.assign({}, result, {
        defaultPresent: !p.q && rows.some(function(row) {
          return row.values[key] == options.default
        }),
        list: rows.slice((page - 1) * size, page * size),
        pageInfo: {
          page: page,
          pageSize: size,
          total: total,
          totalPages: pages,
          hasPrevious: page > 1,
          hasNext: page < pages
        },
        sortInfo: {
          field: field,
          order: order
        },
        queryInfo: {
          applied: true
        }
      })
    }

    // Resolve preview formats
    exports.format = function(name, preview, defaults) {
      var formats = isMap(preview.formats) ? preview.formats : defaults
      var ext = name.indexOf(".") < 0 ? "" : name.substring(name.lastIndexOf(".") + 1).toLowerCase()
      var own = function(k) {
        return Object.prototype.hasOwnProperty.call(formats, k)
      }
      var type = own("name:" + name) ? formats["name:" + name] : (own(ext) ? formats[ext] : __)
      if (isDef(type) && (!isString(type) || !/^[a-z][a-z0-9-]*$/.test(type))) exports.error(400, "Invalid preview format")
      return type
    }

    // Read and decode bounded previews
    exports.readPreview = function(stream, type, limit) {
      var output = new java.io.ByteArrayOutputStream(),
        count = 0,
        n
      try {
        if (isDef(limit) && (!isNumber(limit) || !isFinite(limit) || limit < 1 || limit > 16777216 || Math.floor(limit) != limit)) exports.error(400, "Invalid preview byte limit")
        var max = isDef(limit) ? limit + 1 : 2147483647
        var buffer = java.lang.reflect.Array.newInstance(java.lang.Byte.TYPE, 8192)
        while (count < max && (n = stream.read(buffer, 0, Math.min(buffer.length, max - count))) != -1) {
          if (n > 0) {
            output.write(buffer, 0, n)
            count += n
          }
        }
      } finally {
        stream.close()
      }
      var bytes = output.toByteArray(),
        truncated = isDef(limit) && bytes.length > limit
      if (truncated) bytes = java.util.Arrays.copyOf(bytes, limit)
      var decoder = java.nio.charset.StandardCharsets.UTF_8.newDecoder().onMalformedInput(java.nio.charset.CodingErrorAction.IGNORE)
      var data = String(decoder.decode(java.nio.ByteBuffer.wrap(bytes)))
      if (truncated) return {
        data: data + "\n\n[Preview truncated; download the complete file.]",
        type: "text",
        truncated: true
      }
      if (type == "json") return {
        data: jsonParse(data),
        type: "json"
      }
      if (type == "asciidoc") return {
        stream: new java.io.ByteArrayInputStream(bytes),
        type: "asciidoc"
      }
      return {
        data: data,
        type: type == "markdown" ? "md" : type
      }
    }

    // Define default preview formats
    exports.defaults = {
      md: "markdown",
      yml: "yaml",
      yaml: "yaml",
      css: "css",
      sh: "sh",
      js: "js",
      java: "java",
      py: "python",
      toml: "toml",
      hbs: "handlebars",
      json: "json",
      adoc: "asciidoc"
    }

    // Match cached provider locations
    exports.matchesUnit = function(path, key, base) {
      path = String(path).replace(/\/+$/, "")
      var location
      if (isDef(key.domain)) location = [key.domain, key.repository, key.format, key.namespace, key.package, key.version].filter(function(x) {
        return isDef(x) && x !== ""
      }).join("/")
      else location = isDef(key.puri) ? String(key.puri) : String(key.image || key.uri || "")
      base = String(base || "").replace(/^\/+/, "")
      if (base && location.startsWith(base)) location = location.substring(base.length).replace(/^\/+/, "")
      location = location.replace(/\/+$/, "")
      return !path || !location || path == location || path.startsWith(location + "/") || location.startsWith(path + "/")
    }

    // Manage provider caches and freshness
    exports.provider = function(options) {
      var units = Object.create(null),
        namespace = "browse-" + genUUID(),
        active = $atomic(0)
      var stats = {
          hits: 0,
          misses: 0,
          loads: 0,
          errors: 0
        },
        stores = Object.create(null)
      var unitLocks = [],
        stateLock = new java.lang.Object()
      for (var stripe = 0; stripe < 64; stripe++) unitLocks.push(new java.lang.Object())
      var enhanced = options.query && options.query.enabled || options.operations && options.operations.enabled || options.preview
      return {
        cache: function(name) {
          if (stores[name]) return stores[name]
          var ttl = 5000,
            loader, cache = $cache(namespace + "-" + name),
            lock = namespace + "-" + name
          var facade = {
            ttl: function(value) {
              ttl = isNumber(value) ? value : 5000
              cache.ttl(ttl)
              return facade
            },
            fn: function(fn) {
              loader = fn
              cache.fn(fn)
              return facade
            },
            byDefault: function(a, b) {
              if (!enhanced) cache.byDefault(a, b)
              return facade
            },
            create: function() {
              cache.create()
              return facade
            },
            get: function(key) {
              if (!enhanced) return cache.get(key)
              var id = name + ":" + stringify(key, __, "")
              return syncFn(function() {
                if (units[id] && now() < units[id].expiresAt) {
                  stats.hits++
                  return units[id].value
                }
                stats.misses++
                if (active.inc() > 4) {
                  active.dec()
                  exports.error(503, "Provider busy")
                }
                try {
                  var value = loader(key),
                    t = now()
                  stats.loads++
                  if (!isObject(value)) value = {
                    result: value
                  }
                  syncFn(function() {
                    if (Object.keys(units).length >= 1000) {
                      var keys = Object.keys(units).sort(function(a, b) {
                        return units[a].loadedAt - units[b].loadedAt
                      })
                      delete units[keys[0]]
                    }
                    units[id] = {
                      key: key,
                      name: name,
                      value: value,
                      loadedAt: t,
                      expiresAt: t + ttl
                    }
                  }, stateLock)
                  return value
                } catch (e) {
                  stats.errors++
                  throw e
                } finally {
                  active.dec()
                }
              }, unitLocks[(new java.lang.String(id).hashCode() & 2147483647) % unitLocks.length])
            }
          }
          stores[name] = facade
          return facade
        },
        invalidate: function(predicate) {
          Object.keys(units).forEach(function(id) {
            if (predicate(units[id].name, units[id].key)) delete units[id]
          })
        },
        entries: function(name) {
          return Object.keys(units).map(function(id) {
            return units[id]
          }).filter(function(unit) {
            return unit.name == name
          })
        },
        status: function() {
          return {
            cache: Object.assign({}, stats),
            units: Object.keys(units).length
          }
        },
        freshness: function(predicate) {
          var rows = Object.keys(units).map(function(id) {
            return units[id]
          }).filter(function(u) {
            return !predicate || predicate(u.name, u.key)
          })
          var loaded = rows.length ? Math.min.apply(null, rows.map(function(u) {
              return u.loadedAt
            })) : null,
            expires = rows.length ? Math.min.apply(null, rows.map(function(u) {
              return u.expiresAt
            })) : null
          return {
            loadedAt: loaded,
            expiresAt: expires,
            stale: expires == null || now() >= expires,
            refreshing: false,
            generation: stats.loads
          }
        }
      }
    }

    // Install status, refresh and metrics operations
    exports.installOperations = function(options, validate) {
      if (!options.operations || !options.operations.enabled) return
      var records = Object.create(null),
        lock = "browse-operations-" + genUUID(),
        active = $atomic(0)
      var metrics = {
        requests: 0,
        errors: 0,
        durationMs: 0,
        refreshes: 0,
        searches: 0,
        searchTruncations: 0,
        previewTruncations: 0
      }
      var csrf = genUUID(),
        hooks = options._fns,
        ttl = options.operations.ttlMs || 30000
      var record = function(path) {
        var t = now()
        Object.keys(records).forEach(function(k) {
          if (t - records[k].touched > 1800000 && !records[k].refreshing) delete records[k]
        })
        if (!records[path]) {
          var keys = Object.keys(records)
          if (keys.length >= 1000) {
            keys.sort(function(a, b) {
              return records[a].touched - records[b].touched
            })
            var victim = keys.filter(function(k) {
              return !records[k].refreshing
            })[0]
            if (isUnDef(victim)) exports.error(503, "Browse busy")
            delete records[victim]
          }
          records[path] = {
            loadedAt: null,
            expiresAt: null,
            generation: 0,
            refreshing: false,
            lastRefresh: 0
          }
        }
        records[path].touched = t
        return records[path]
      }
      var snapshot = function(path) {
        var r = record(path)
        return {
          loadedAt: r.loadedAt,
          expiresAt: r.expiresAt,
          stale: r.expiresAt == null || now() >= r.expiresAt,
          refreshing: r.refreshing,
          generation: r.generation,
          lastError: r.lastError || null
        }
      }

      // Track provider requests and freshness
      var originalFreshness = hooks.getFreshness,
        originalStatus = hooks.getStatus,
        originalRefresh = hooks.refresh;
      ["getList", "getObj", "search"].forEach(function(name) {
        if (!isFunction(hooks[name])) return
        var original = hooks[name]
        hooks[name] = function(request, opts) {
          var began = now(),
            result
          try {
            result = original(request, opts)
            if (!isFunction(originalFreshness)) syncFn(function() {
              var r = record(request.uri)
              r.loadedAt = now()
              r.expiresAt = now() + ttl
            }, lock)
            syncFn(function() {
              metrics.requests++
              if (name == "search") metrics.searches++
              if (result && result.searchInfo && result.searchInfo.truncated) metrics.searchTruncations++
              if (result && result.truncated) metrics.previewTruncations++
            }, lock)
            return result
          } catch (e) {
            syncFn(function() {
              metrics.errors++
            }, lock)
            throw e
          } finally {
            syncFn(function() {
              metrics.durationMs += now() - began
            }, lock)
          }
        }
      })
      hooks.getFreshness = function(request, opts) {
        validate(request, opts)
        if (isFunction(originalFreshness)) return originalFreshness(request, opts)
        return syncFn(function() {
          return snapshot(request.uri)
        }, lock)
      }
      hooks.getStatus = function(request, opts) {
        validate(request, opts)
        return {
          capabilities: opts.capabilities,
          metrics: Object.assign({}, metrics),
          provider: isFunction(originalStatus) ? originalStatus(request, opts) : {},
          trackedLocations: Object.keys(records).length
        }
      }

      // Refresh locations within concurrency and retry limits
      hooks.refresh = function(request, opts) {
        validate(request, opts)
        if (request.method != "POST") exports.error(405, "Refresh requires POST")
        var path = request.uri,
          owner = false,
          retry
        syncFn(function() {
          var r = record(path)
          retry = Math.max(0, 10000 - (now() - r.lastRefresh))
          if (!r.refreshing && !retry) {
            r.refreshing = true
            r.lastRefresh = now()
            owner = true
          }
        }, lock)
        if (!owner) return {
          refreshed: false,
          retryIn: Math.ceil(retry / 1000),
          refreshing: snapshot(path).refreshing
        }
        if (active.inc() > 4) {
          active.dec()
          syncFn(function() {
            record(path).refreshing = false
          }, lock)
          exports.error(503, "Browse busy")
        }
        try {
          if (isFunction(originalRefresh)) originalRefresh(request, opts)
          else {
            var r = hooks.getList(request, opts)
            if (r.isFile) {
              var obj = hooks.getObj(request, opts)
              if (obj.stream) obj.stream.close()
            }
          }
          syncFn(function() {
            var r = record(path)
            r.loadedAt = now()
            r.expiresAt = now() + ttl
            r.generation++
            r.lastError = null
            metrics.refreshes++
          }, lock)
          return {
            refreshed: true,
            freshness: snapshot(path)
          }
        } catch (e) {
          syncFn(function() {
            record(path).lastError = "Refresh failed"
          }, lock)
          throw e
        } finally {
          active.dec()
          syncFn(function() {
            record(path).refreshing = false
          }, lock)
        }
      }

      // Dispatch browser operations
      options._operation = function(action, request, server, api) {
        if (!api && action == "refresh" && (request.params || {}).csrf !== csrf) exports.error(403, "Invalid refresh token")
        if (action == "status") return ow.server.httpd.reply(hooks.getStatus(request, options))
        if (action == "freshness") return ow.server.httpd.reply(hooks.getFreshness(request, options))
        if (action == "refresh") return ow.server.httpd.reply(hooks.refresh(request, options))
        if (action == "metrics") {
          validate(request, options)
          ow.loadMetrics()
          if (!isFunction(ow.metrics._fromObj2OpenMetricsStrict)) exports.error(501, "Strict OpenMetrics requires an updated OpenAF runtime")
          return {
            data: ow.metrics.fromObj2OpenMetrics(metricSnapshot(), "browse", __, __, __, true),
            status: 200,
            mimetype: "application/openmetrics-text; version=1.0.0; charset=utf-8",
            header: {}
          }
        }
        exports.error(404, "Unknown browse operation")
      }
      options._refreshToken = csrf

      // Collect provider metrics
      var metricSnapshot = function() {
        var out = Object.assign({}, metrics)
        if (isFunction(originalStatus)) {
          var status = originalStatus({
              uri: options.parentURI,
              params: {}
            }, options) || {},
            cache = status.cache || {};
          ["hits", "misses", "loads", "errors"].forEach(function(key) {
            if (isNumber(cache[key])) out["cache_" + key] = cache[key]
          })
          if (isNumber(status.units)) out.cache_units = status.units
        }
        return out
      }
      ow.loadMetrics()
      ow.metrics.add("browse_" + sha256(String(options.port) + options.parentURI).substring(0, 16), metricSnapshot)
    }

jobs:
# -------------------
- name : HTTP Browser
  deps :
  - HTTP Start Server
  to   : HTTP Service
  typeArgs:
    noLog: false 
    shortcut:
      name  : httpdBrowser
      keyArg: port
      args  : 
        uri      : uri
        type     : type
        options  : options
  help : 
   text   : Provides a HTTP browser service based on an existing type.
   expects:
   - name: port
     desc: (Number) The port where the server was made available (default is 8091)
   - name: uri
     desc: (String) The URI where the HTTP File Browser will be available.
   - name: type
     desc: (String) The type of the HTTP Browser services to be used (based on ow.server.httpd.browse.*)
   - name: options
     desc: (Map) A map with options to be passed
  check:
    in:
      port     : toNumber.default(8091)
      uri      : isString.default("/")
      type     : isString.default("files")
      #options  : isMap.default({})  
  args :
    execURI: | #js
      try {
        var _options = global.__GBHTTPD[String(port) + uri]
        return ow.server.httpd.replyBrowse(server, request, _options)
      } catch(e) {
        $err(e)
        return { data: "Internal error", mimetype: "text/plain", status: 500, header: {} }
      }
  exec : | #js
    global.__GBHTTPD = global.__GBHTTPD || {}

    if (isUnDef(ow.server.httpd.browse[args.type])) throw new Error("Invalid type provided: " + args.type)
    args.options = Object.assign({}, args.options || {}, {
      port: args.port
    })
    var definition = ow.server.httpd.browse[args.type](args.uri, args.options)
    require("ojob-browse-contract.js").check(args.options, definition.capabilities)
    global.__GBHTTPD[String(args.port) + args.uri] = definition

# --------------------------
- name : HTTP Browse generic
  deps :
  - HTTP Start Server
  to   : HTTP Service
  typeArgs:
    noLog: false 
    shortcut:
      name  : httpdBrowse
      keyArg: port
      args  : 
        uri      : uri
        path     : path
        templates: templates
        fns      : fns
        options  : options
  help : 
   text   : Provides a HTTP browse definition. 
   expects:
   - name: port
     desc: (Number) The port where the server was made available (default is 8091)
   - name: uri
     desc: (String) The URI where the HTTP File Browse will be available.
   - name: templates
     desc: (Map) A map with templates to be used.
   - name: fns
     desc: (Map) A map with functions to be used in the template.
   - name: options
     desc: (Map) A map with options to be passed
  check:
    in:
      port     : toNumber.isNumber.default(8091)
      uri      : isString.default("/")
      path     : isString.default("")
      templates: isMap.default({})
      fns      : isMap.default({})
      options  : isMap.default({})
  args :
    execURI: | #js
      try {
        var _options = global.__GBHTTPD[String(port) + uri]
        var _out = ""
        var relative = global.__ojobHttpRelativePath(request.uri, _options.parentURI)
        if (_options._operation && relative.startsWith("@@/")) {
          var operation = relative.substring(3),
            target = Object.assign({}, request)
          target.uri = _options.parentURI.replace(/\/$/, "") + "/" + String((request.params || {}).path || "").replace(/^\/+/, "")
          return _options._operation(operation, target, server, false)
        }
        var _lst = _options.query && _options.query.enabled && request.params.q && isFunction(_options._fns.search) ?
          _options._fns.search(request, _options) : _options._fns.getList(request, _options)

        if (_lst.isList) {
            _out = _options._fns.renderList(_lst, server, request, _options)
            if (isMap(_out)) return _out
        } else {
            if (_lst.isFile) {
              var _obj = _options._fns.getObj(request, _options)
              return _options._fns.renderObj(_obj, server, request, _options)
            } else {
                _out = _options._fns.renderEmpty(request, _options)
            }
        }

        return server.replyOKHTML( String(_out) )
      } catch(e) {
        if (e.httpStatus == 403) return { data: "Forbidden", mimetype: "text/plain", status: 403, header: {} }
        if ([400, 404, 405, 501, 503].indexOf(e.httpStatus) >= 0) return {
          data: "Browse request rejected",
          mimetype: "text/plain",
          status: e.httpStatus,
          header: {}
        }
        logErr(`Error: ${e.message} | ` + $err(e,__,true))
        return { data: "Internal error", mimetype: "text/plain", status: 500, header: {} }
      }
  exec : | #js
    ow.loadTemplate(); ow.loadFormat(); ow.loadServer()

    const escapeText = global.__ojobHttpEscapeText
    const fileLink = global.__ojobHttpFileLink
    var defaultFilesystem = !isFunction(args.fns.getList) && !isFunction(args.fns.getObj)

    // Check the functions provided
    args.fns.getList = _$(args.fns.getList, "args.fns.getList").isFunction().default((request, options) => {
      const uri = request.uri
      var puri = global.__ojobHttpRelativePath(uri, options.parentURI)

      var file = global.__ojobHttpResolveFile(options.parentPath, puri)
      if (io.fileExists(file)) {
          if (io.fileInfo(file).isFile) {
              return { isFile: true }
          } 
      } else {
          return { isFile: false }
      }

      var lst = io.listFiles(file).files.filter(r => {
        try { global.__ojobHttpResolveFile(options.parentPath, (puri == "" ? "" : puri + "/") + r.filename); return true }
        catch(e) { return false }
      })
      return {
          isList     : true,
          fields     : [ "Filename", "Last modified", "Size", "Size in bytes" ],
          alignFields: [ "left", "center", "right", "right" ],
          key        : "Filename",
          list       : lst.map(r => ({
              isDirectory: r.isDirectory,
              sortValues : { Size:r.size, "Last modified":r.lastModified },
