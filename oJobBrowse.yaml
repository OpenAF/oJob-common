    if (isUnDef(global.__GBHTTPDAPI)) global.__GBHTTPDAPI = {}
    global.__GBHTTPDAPI[String(args.port) + args.uri] = { browseUri: args.browseUri, operationsBrowseUris: args.operationsBrowseUris || [], requiredOptions: args.options }
