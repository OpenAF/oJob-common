        if (action == "status") return ow.server.httpd.reply(hooks.getStatus(request, options))
        if (action == "freshness") return ow.server.httpd.reply(hooks.getFreshness(request, options))
        if (action == "refresh") return ow.server.httpd.reply(hooks.refresh(request, options))
        if (action == "metrics") {
          validate(request, options)
          ow.loadMetrics()
          if (!isFunction(ow.metrics._fromObj2OpenMetricsStrict)) exports.error(501, "Strict OpenMetrics requires an updated OpenAF runtime")
          return {
            data: ow.metrics.fromObj2OpenMetrics(metricSnapshot(), "browse", __, __, __, true),
            status: 200,
            mimetype: "application/openmetrics-text; version=1.0.0; charset=utf-8",
            header: {}
          }
        }
        exports.error(404, "Unknown browse operation")
      }
      options._refreshToken = csrf

      // Collect provider metrics
      var metricSnapshot = function() {
        var out = Object.assign({}, metrics)
        if (isFunction(originalStatus)) {
          var status = originalStatus({
              uri: options.parentURI,
              params: {}
            }, options) || {},
            cache = status.cache || {};
          ["hits", "misses", "loads", "errors"].forEach(function(key) {
            if (isNumber(cache[key])) out["cache_" + key] = cache[key]
          })
          if (isNumber(status.units)) out.cache_units = status.units
        }
        return out
      }
      ow.loadMetrics()
      ow.metrics.add("browse_" + sha256(String(options.port) + options.parentURI).substring(0, 16), metricSnapshot)
    }

