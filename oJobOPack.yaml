# oPack oJob functionality
# Copyright 2023 Nuno Aguiar

jobs:
   # oPack Pack external
   #
   - name: oPack Pack external
     help: > 
        Packs an external opack given an url or opack name:
         
          name        (String)  The url or opack name to pack
          filePath    (String)  The filepath to the opack
          tmpDir      (String)  Temporary folder to use (defaults to "./tmp")
          outputDir   (String)  Output folder where the opack will be placed (defaults to ".")
          noVersion   (Boolean) Creates the opack without any version info
          withSymLink (Boolean) Creates a symlink without version pointing to the version one just created.
     exec: |
       args.tmpDir = _$(args.tmpDir).isString().default("./tmp");
       args.outputDir = _$(args.outputDir).isString().default(".");
       args.name = _$(args.name).isString().default(void 0);
       args.filePath = _$(args.filePath).isString().default(void 0);
       if (isUnDef(args.name) && isUnDef(args.filePath)) throw "You need to define a opack args.name ou args.filePath";

       if (getVersion() < 20171106) logWarn("It's advisable to use an OpenAF version equal or greater than 20171106.");

       var ownedSource = isUnDef(args.filePath);
       if (ownedSource) {
         io.rm(args.tmpDir);
         io.mkdir(args.tmpDir);
       } else {
         args.tmpDir = args.filePath;
       }
       io.mkdir(args.outputDir);

       var pack, cleanup;
       var component = value => {
         if (isNumber(value) && isFinite(value)) value = String(value);
         if (!isString(value) || value.length == 0 || value == "." || value == ".." || /[\/\\:\x00-\x1f]/.test(value)) throw new Error("Invalid package name or version");
         return value;
       };
       var validateTree = () => {
         var root = new java.io.File(args.tmpDir).getCanonicalFile().toPath();
         // pack regenerates its manifest. Validate every file it can discover, not just old entries.
         var follow = java.lang.reflect.Array.newInstance(java.lang.Class.forName("java.nio.file.FileVisitOption"), 1);
         follow[0] = java.nio.file.FileVisitOption.FOLLOW_LINKS;
         var paths = java.nio.file.Files.walk(root, follow);
         try {
           var entries = paths.iterator();
           while (entries.hasNext()) {
             if (!entries.next().toFile().getCanonicalFile().toPath().startsWith(root)) throw new Error("Package symlink outside source directory");
           }
         } finally { paths.close(); }
       };
       var validate = complete => {
         validateTree();
         try { pack = io.readFile(args.tmpDir + "/.package.json"); }
         catch(e) { pack = io.readFileYAML(args.tmpDir + "/.package.yaml"); }
         if (complete || isDef(pack.name)) pack.name = component(pack.name);
         if (complete || isDef(pack.version)) pack.version = component(pack.version);
         if (!complete && isUnDef(pack.files)) pack.files = [];
         if (!isArray(pack.files)) throw new Error("Invalid package file list");
         var root = new java.io.File(args.tmpDir).getCanonicalFile().toPath();
         cleanup = pack.files.map(file => {
           if (!isString(file) || /[\\\x00]/.test(file) || /^(\/|[a-z]:)/i.test(file)) throw new Error("Invalid package file path");
           var target = new java.io.File(args.tmpDir + "/" + file).getCanonicalFile().toPath();
           if (target.equals(root) || !target.startsWith(root)) throw new Error("Package file outside source directory");
           return String(target);
         });
       };
       sync(() => {
          if (ownedSource && isDef(args.name)) oPack("install " + args.name + " -d " + args.tmpDir + " -justcopy");
          validate();
          oPack("pack " + args.tmpDir);
          validate(true);
       }, oPack);

       if (!args.noVersion) {
         io.mv(pack.name + "-" + pack.version + ".opack", args.outputDir + "/" + pack.name + "-" + pack.version + ".opack");
       } else {
         io.mv(pack.name + "-" + pack.version + ".opack", args.outputDir + "/" + pack.name + ".opack");
       }
       if (args.withSymLink) {
         var archive = pack.name + (args.noVersion ? "" : "-" + pack.version) + ".opack";
         var link = new java.io.File(args.outputDir + "/" + pack.name + ".opack").toPath();
         var target = new java.io.File(args.outputDir + "/" + archive).getCanonicalFile().toPath();
         if (!args.noVersion) java.nio.file.Files.createSymbolicLink(link, target);
       }
         
       if (ownedSource) {
         cleanup.forEach(file => io.rm(file));
         io.rm(args.tmpDir);
       }
