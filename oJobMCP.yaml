# Copyright 2025 Nuno Aguiar
# MCP Server Job
# This job starts a MCP server that listens for requests and executes jobs based on the requests.

include:
- oJobHTTPd.yaml

jobs:
# -------------------------
- name    : HTTP MCP Server
  typeArgs:
    noLog   : false 
    shortcut:
      name  : httpdMCP
      keyArg: port
      args  :
        description  : description
        uri          : uri
        usestream    : usestream
        debug        : debug
        tplDesc      : tplDesc
        toolPrefix   : toolPrefix
        fnsMeta      : fnsMeta
        fns          : fns
        authtoken      : authtoken
        authheader     : authheader
        authscheme     : authscheme
        authrealm      : authrealm
        authchallenge  : authchallenge
        authapiurl     : authapiurl
        authapimethod  : authapimethod
        authapitimeout : authapitimeout
        authapicachettl: authapicachettl
        authapicachemax: authapicachemax
        audit          : audit
        modern         : modern
  help    :
    text: Starts a MCP server to handle requests with execution of jobs.
    expects:
    - name: port
      desc: (Number) The port to listen on.
    - name: uri
      desc: (String) The URI to handle requests. Default is "/mcp".
    - name: usestream
      desc: (Boolean) If true, returns responses as HTTP SSE stream events.
    - name: debug
      desc: (Boolean) If true, debug messages will be logged.
    - name: tplDesc
      desc: (Boolean) If true, all tool description fields in fnsMeta are evaluated as handlebars templates with the current oJob args.
    - name: toolPrefix
      desc: (String) If defined, prefixes exposed MCP tool names without changing fns/fnsMeta key mapping.
    - name: fnsMeta
      desc: (Map) Metadata for the functions available in the MCP server.
    - name: fns
      desc: (Map) Functions to be executed when called from the MCP server.
    - name: authtoken
      desc: (String) If defined (or env OJOB_MCP_AUTH_TOKEN), requires this bearer token on every request to this MCP endpoint. If not defined, no authentication is enforced (default behavior).
    - name: authheader
      desc: (String) The request header to read the credential from (default "authorization", or env OJOB_MCP_AUTH_HEADER).
    - name: authscheme
      desc: (String) The authorization scheme prefix expected before the token (default "Bearer", or env OJOB_MCP_AUTH_SCHEME).
    - name: authrealm
      desc: (String) The realm reported in the WWW-Authenticate challenge (default is the MCP server's name, or env OJOB_MCP_AUTH_REALM).
    - name: authchallenge
      desc: (Boolean) If true (default), unauthenticated/unauthorized requests receive a WWW-Authenticate header (or env OJOB_MCP_AUTH_CHALLENGE).
    - name: authapiurl
      desc: (String) If defined (or env OJOB_MCP_AUTH_API_URL), validates the bearer credential by calling this URL instead of comparing it against authtoken. The incoming auth header is forwarded verbatim (same header name and value, including scheme), together with X-OJob-MCP-URI, X-OJob-MCP-Port, X-OJob-MCP-Name, X-OJob-MCP-Title, X-OJob-MCP-Version, X-OJob-MCP-Protocol-Version, X-OJob-MCP-Tool-Prefix and X-OJob-MCP-Stream headers describing this MCP. A 2xx response means valid; any other response, or a request error/timeout, means invalid (fails closed). Mutually exclusive with authtoken -- if both are defined, authapiurl takes precedence.
    - name: authapimethod
      desc: (String) The HTTP method used for the authapiurl validation call (default "GET", or env OJOB_MCP_AUTH_API_METHOD).
    - name: authapitimeout
      desc: (Number) Timeout in milliseconds for the authapiurl validation call (default 5000, or env OJOB_MCP_AUTH_API_TIMEOUT).
    - name: authapicachettl
      desc: (Number) If greater than 0, caches a token's authapiurl validation result in memory for this many milliseconds to avoid calling the validation service on every request (default 0, disabled; or env OJOB_MCP_AUTH_API_CACHE_TTL).
    - name: authapicachemax
      desc: (Number) Maximum number of entries kept in the authapiurl validation cache (default 1000, or env OJOB_MCP_AUTH_API_CACHE_MAX). Expired entries are evicted first, then the entry closest to expiring, so distinct credentials cannot grow the cache without limit.
    - name: audit
      desc: (Boolean) If true (or env OJOB_MCP_AUDIT), logs every tool call (tool name, arguments, User-Agent and, when available, client IP) via OpenAF's log() function. The IP is best-effort, read from the X-Forwarded-For/X-Real-IP request headers, since OpenAF's HTTP server does not expose the raw socket address -- it is only populated when a reverse proxy sets one of those headers. Default false (no auditing).
    - name: modern
      desc: (Boolean) If true (or env OJOB_MCP_MODERN), also serves the 2026-07-28 stateless/per-request MCP protocol era (server/discover, per-request protocol version negotiation, resultType/ttlMs/cacheScope on results) side-by-side with the legacy initialize-handshake era, for any request that declares a modern protocol version. Default is false, so previous (legacy-only) behavior is unchanged unless explicitly opted in.
  check   :
    in:
      description  : isMap.default(__)
      port         : isNumber
      uri          : isString.default("/mcp")
      usestream    : toBoolean.isBoolean.default(false)
      debug        : toBoolean.isBoolean.default(false)
      tplDesc      : toBoolean.isBoolean.default(false)
      toolPrefix   : isString.default("")
      fnsMeta      : isMap.default({})
      fns          : isMap.default({})
      authtoken      : isString.default(__)
      authheader     : isString.default(__)
      authscheme     : isString.default(__)
      authrealm      : isString.default(__)
      authchallenge  : isString.default(__)
      authapiurl     : isString.default(__)
      authapimethod  : isString.default(__)
      authapitimeout : default(__)
      authapicachettl: default(__)
      authapicachemax: default(__)
      audit          : default(__)
      modern         : default(__)
  deps    :
  - HTTP Start Server
  exec    : | #js
    var _applyTemplate = (meta, allStrings) => {
      if (!args.tplDesc) return meta
      var _walk = obj => {
        if (isString(obj) && allStrings) return $t(obj, args)
        if (isArray(obj)) return obj.map(_walk)
        if (isMap(obj)) {
          Object.keys(obj).forEach(k => {
            if (isString(obj[k]) && (allStrings || k == "description")) {
              obj[k] = $t(obj[k], args)
            } else {
              obj[k] = _walk(obj[k])
            }
          })
        }
        return obj
      }
      return _walk(meta)
    }

    // Ensures default server info and capabilities
    args.description = merge({
      protocolVersion: "2024-11-05",
      serverInfo: {
          name: "OpenAF",
          title: "OpenAF MCP server",
          version: "1.0.0"
      },
      capabilities: {
          prompts: {
              listChanged: true
          },
          tools: {
              listChanged: true
          }
      }
    }, args.description)
    args.description = _applyTemplate(clone(args.description), true)

    // Opt-in support for the 2026-07-28 stateless/per-request MCP protocol era, side-by-side with the legacy
    // initialize-handshake era above (which stays the default and is left fully unchanged when modern is false).
    args.modern = toBoolean(_$(args.modern).default(getEnv("OJOB_MCP_MODERN") || "false"))

    // Optional bearer-token authentication for this HTTP MCP endpoint (opt-in; fails open when unconfigured)
    var _authToken     = _$(args.authtoken).default(getEnv("OJOB_MCP_AUTH_TOKEN"))
    var _authHeader    = String(_$(args.authheader).default(getEnv("OJOB_MCP_AUTH_HEADER") || "authorization")).toLowerCase()
    var _authScheme    = _$(args.authscheme).default(getEnv("OJOB_MCP_AUTH_SCHEME") || "Bearer")
    var _authRealm     = _$(args.authrealm).default(getEnv("OJOB_MCP_AUTH_REALM") || args.description.serverInfo.name)
    var _authChallenge = toBoolean(_$(args.authchallenge).default(getEnv("OJOB_MCP_AUTH_CHALLENGE") || "true"))

    // Optional external HTTP-based token validation (opt-in; mutually exclusive with authtoken -- takes precedence when both are set)
    var _authApiUrl      = _$(args.authapiurl).default(getEnv("OJOB_MCP_AUTH_API_URL"))
    var _authApiMethod   = _$(args.authapimethod).default(getEnv("OJOB_MCP_AUTH_API_METHOD") || "GET")
    var _authApiTimeout  = Number(_$(args.authapitimeout).default(getEnv("OJOB_MCP_AUTH_API_TIMEOUT") || 5000))
    var _authApiCacheTTL = Number(_$(args.authapicachettl).default(getEnv("OJOB_MCP_AUTH_API_CACHE_TTL") || 0))
    var _authApiEnabled  = isString(_authApiUrl) && _authApiUrl.length > 0
    // Bounded: the cache is keyed by the credential, so distinct (even invalid) tokens would otherwise
    // grow it without limit. Expired entries go first, then the entry closest to expiring.
    var _authApiCacheMax = Number(_$(args.authapicachemax).default(getEnv("OJOB_MCP_AUTH_API_CACHE_MAX") || 1000))
    if (!isFinite(_authApiCacheMax) || _authApiCacheMax <= 0) _authApiCacheMax = 1000
    var _authApiCache    = {}
    var _authApiCachePut = (key, ok) => {
      if (_authApiCacheTTL <= 0) return
      var _keys = Object.keys(_authApiCache)
      if (_keys.length >= _authApiCacheMax) {
        var _t = now()
        _keys.forEach(k => { if (_authApiCache[k].exp <= _t) delete _authApiCache[k] })
        _keys = Object.keys(_authApiCache)
        if (_keys.length >= _authApiCacheMax) {
          var _drop = _keys[0]
          _keys.forEach(k => { if (_authApiCache[k].exp < _authApiCache[_drop].exp) _drop = k })
          delete _authApiCache[_drop]
        }
      }
      _authApiCache[key] = { ok: ok, exp: now() + _authApiCacheTTL }
    }
    var _authApiMcpHeaders = {
      "X-OJob-MCP-URI"             : String(args.uri),
      "X-OJob-MCP-Port"            : String(args.port),
      "X-OJob-MCP-Name"            : String(args.description.serverInfo.name),
      "X-OJob-MCP-Title"           : String(args.description.serverInfo.title),
      "X-OJob-MCP-Version"         : String(args.description.serverInfo.version),
      "X-OJob-MCP-Protocol-Version": String(args.description.protocolVersion),
      "X-OJob-MCP-Tool-Prefix"     : String(args.toolPrefix),
      "X-OJob-MCP-Stream"          : String(args.usestream)
    }

    var _authEnabled   = _authApiEnabled || (isString(_authToken) && _authToken.length > 0)

    var _authCheck = headerValue => {
      if (!isString(headerValue)) return false
      var _m = headerValue.match(new RegExp("^" + _authScheme + "\\s+(.+)$", "i"))
      if (isNull(_m)) return false
      return sha512(_m[1]) == sha512(_authToken)
    }

    // Validates the credential by forwarding it, unchanged, and identifying this MCP to an external HTTP service; a 2xx response means valid.
    // Fails closed: any non-2xx response, request error, or timeout is treated as invalid.
    var _authCheckExternal = headerValue => {
      if (!isString(headerValue)) return false
      var _m = headerValue.match(new RegExp("^" + _authScheme + "\\s+(.+)$", "i"))
      if (isNull(_m)) return false

      var _key = sha512(headerValue)
      if (_authApiCacheTTL > 0 && isDef(_authApiCache[_key]) && _authApiCache[_key].exp > now()) {
        return _authApiCache[_key].ok
      }

      var _ok = false
      try {
        ow.loadObj()
        var _hdrs = merge({}, _authApiMcpHeaders)
        _hdrs[_authHeader] = headerValue
        // arg 6 only sets the connect timeout; options.timeout is what bounds the whole call, so a
        // validator that accepts the connection and never replies cannot hang the request thread
        var _res = (new ow.obj.http()).exec(_authApiUrl, _authApiMethod, "", _hdrs, false, _authApiTimeout, false, { timeout: _authApiTimeout })
        _ok = isMap(_res) && _res.responseCode >= 200 && _res.responseCode < 300
      } catch(e) {
        if (args.debug) logErr("MCP auth API validation error: " + e.message)
        _ok = false
      }

      _authApiCachePut(_key, _ok)
      return _ok
    }

    var _authReject = () => {
      var _hdrs = {}
      if (_authChallenge) _hdrs["WWW-Authenticate"] = _authScheme + " realm=\"" + _authRealm + "\""
      return {
        data    : stringify({ jsonrpc: "2.0", error: { code: -32001, message: "Unauthorized" } }, __, ""),
        mimetype: "application/json",
        status  : 401,
        header  : _hdrs
      }
    }

    // Strips the auth credential before it reaches tool jobs (avoids leaking the shared secret via echoed args/errors)
    var _scrubAuthHeader = req => {
      if (!_authEnabled || !isMap(req) || !isMap(req.header)) return req
      var _r = merge({}, req)
      _r.header = merge({}, req.header)
      delete _r.header[_authHeader]
      delete _r.header.authorization
      return _r
    }

    // Optional per-tool-call audit logging (opt-in; fails closed/off by default; logs via OpenAF's log() function)
    var _auditEnabled = toBoolean(_$(args.audit).default(getEnv("OJOB_MCP_AUDIT") || "false"))
    var _auditServer  = isMap(args.description) && isMap(args.description.serverInfo) ? args.description.serverInfo.name : "mcp"

    // Optional best-effort audit webhooks. Snapshot before scheduling to isolate mutable job args.
    var _preHookURL = String(getEnv("OJOB_MCP_PREHOOK_URL") || "").trim()
    var _postHookURL = String(getEnv("OJOB_MCP_POSTHOOK_URL") || "").trim()
    var _hookIncludeArgs = String(getEnv("OJOB_MCP_HOOK_INCLUDE_ARGS") || "").trim().toLowerCase() === "true"
    var _hookIncludeResult = String(getEnv("OJOB_MCP_HOOK_INCLUDE_RESULT") || "").trim().toLowerCase() === "true"
    // Request headers are never attached unless explicitly opted in; the auth credential is stripped either way
    var _hookIncludeHeaders = String(getEnv("OJOB_MCP_HOOK_INCLUDE_HEADERS") || "").trim().toLowerCase() === "true"
    var _hookTimeout = Number(getEnv("OJOB_MCP_HOOK_TIMEOUT") || 5000)
    if (!isFinite(_hookTimeout) || _hookTimeout <= 0) _hookTimeout = 5000
    // $doV is unbounded (virtual threads), so without a cap a slow/hanging receiver lets every tool call
    // pile up an outstanding delivery and socket -- deliveries above the cap are dropped, never queued
    var _hookMaxInFlight = Number(getEnv("OJOB_MCP_HOOK_MAX_INFLIGHT") || 64)
    if (!isFinite(_hookMaxInFlight) || _hookMaxInFlight <= 0) _hookMaxInFlight = 64
    // Hard ceiling on a single event body; an oversized event is sent as metadata only
    var _hookMaxBody = Number(getEnv("OJOB_MCP_HOOK_MAX_BODY") || 65536)
    if (!isFinite(_hookMaxBody) || _hookMaxBody <= 0) _hookMaxBody = 65536
    // Optional credential so the receiver can authenticate the events it is sent
    var _hookAuthToken = String(getEnv("OJOB_MCP_HOOK_AUTH_TOKEN") || "").trim()
    var _hookAuthHeader = String(getEnv("OJOB_MCP_HOOK_AUTH_HEADER") || "authorization").trim()
    var _hookAuthScheme = String(getEnv("OJOB_MCP_HOOK_AUTH_SCHEME") || "Bearer").trim()
    var _hookEnabled = _preHookURL.length > 0 || _postHookURL.length > 0
    if (_hookEnabled) ow.loadObj()
    var _hookInFlight = $atomic(0, "long")
    var _hookFailure = () => { try { logErr("MCP audit webhook delivery failed") } catch(ignore) {} }
    var _hookDropped = () => { try { logErr("MCP audit webhook dropped (in-flight cap reached)") } catch(ignore) {} }
    // Copies request headers for the receiver minus the MCP auth credential. Unlike _scrubAuthHeader this
    // strips case-insensitively and unconditionally, so the secret never leaves the process through a hook.
    var _hookHeaders = req => {
      if (!_hookIncludeHeaders || !isMap(req) || !isMap(req.header)) return __
      var _n = String(isString(args.authheader) && args.authheader.length > 0
                      ? args.authheader
                      : (getEnv("OJOB_MCP_AUTH_HEADER") || "authorization")).toLowerCase()
      var _h = {}
      Object.keys(req.header).forEach(k => {
        var _lk = String(k).toLowerCase()
        if (_lk != _n && _lk != "authorization") _h[k] = req.header[k]
      })
      return _h
    }
    // Keeps a single event from becoming an arbitrarily large POST on the audit receiver
    var _hookBody = event => {
      var _body = stringify(event, __, "")
      if (isString(_body) && _body.length > _hookMaxBody) {
        var _trimmed = merge({}, event)
        delete _trimmed.arguments
        delete _trimmed.result
        delete _trimmed.error
        delete _trimmed.headers
        _trimmed.truncated = true
        _body = stringify(_trimmed, __, "")
      }
      return _body
    }
    var _sendHook = (url, event) => {
      if (!url) return
      if (_hookInFlight.inc() > _hookMaxInFlight) { _hookInFlight.dec(); _hookDropped(); return }
      try {
        var body = _hookBody(event)
        var _hdrs = { "Content-Type": "application/json" }
        if (_hookAuthToken.length > 0) _hdrs[_hookAuthHeader] = (_hookAuthScheme.length > 0 ? _hookAuthScheme + " " : "") + _hookAuthToken
        $doV(() => {
          try {
            var response = (new ow.obj.http()).exec(url, "POST", body,
              _hdrs, false, _hookTimeout, false, { timeout: _hookTimeout })
            if (!isMap(response) || response.responseCode < 200 || response.responseCode >= 300) _hookFailure()
          } catch(e) {
            _hookFailure()
          } finally {
            _hookInFlight.dec()
          }
        }, _hookFailure)
      } catch(e) { _hookInFlight.dec(); _hookFailure() }
    }
    var _startHook = (tool, wireTool, toolArgs, client, headers) => {
      if (!_hookEnabled) return __
      try {
        var context = {
          callId: genUUID(), startedAt: now(), server: args.description.serverInfo,
          transport: "http", tool: tool, wireTool: wireTool,
          argumentCount: isMap(toolArgs) ? Object.keys(toolArgs).length : 0
        }
        if (_hookIncludeArgs) context.arguments = toolArgs
        if (isDef(client)) context.client = client
        if (isDef(headers)) context.headers = headers
        // Retain an independent snapshot for post-only configurations too.
        context = JSON.parse(stringify(context, __, ""))
        _sendHook(_preHookURL, merge(context, { phase: "pre", timestamp: context.startedAt }))
        return context
      } catch(e) { _hookFailure(); return __ }
    }
    var _endHook = (context, result, error) => {
      if (isUnDef(context) || !_postHookURL) return
      try {
        var finishedAt = now()
        var event = merge(context, {
          phase: "post", timestamp: finishedAt, durationMs: finishedAt - context.startedAt,
          isError: isDef(error) || (isMap(result) && result.isError === true)
        })
        if (_hookIncludeResult && isDef(error)) event.error = String(isDef(error.message) ? error.message : error)
        if (_hookIncludeResult && isDef(result)) event.result = result
        _sendHook(_postHookURL, event)
      } catch(e) { _hookFailure() }
    }
    // Header lookup is case-insensitive: the JDK-backed impl preserves "User-Agent" casing while the default nano-based impl lowercases it
    var _getHeader = (req, name) => {
      if (!isMap(req) || !isMap(req.header)) return __
      var _k = Object.keys(req.header).filter(k => k.toLowerCase() == name.toLowerCase())
      return _k.length > 0 ? req.header[_k[0]] : __
    }
    // Sanitizes attacker-controlled header values before they reach the audit log (strips CR/LF, caps length)
    var _sanitizeAuditVal = v => isString(v) ? v.replace(/[\r\n]/g, " ").substring(0, 256) : __
    // Tool arguments are attacker-controlled too, so scrub string leaves and keys before they reach the
    // log. This copy is for logging only -- the tool job and the audit webhooks still get the raw values.
    var _sanitizeAuditArgs = (o, d) => {
      d = isDef(d) ? d : 0
      if (d > 8) return "..."
      if (isString(o)) return _sanitizeAuditVal(o)
      if (isArray(o)) return o.map(v => _sanitizeAuditArgs(v, d + 1))
      if (isMap(o)) {
        var _r = {}
        Object.keys(o).forEach(k => { _r[_sanitizeAuditVal(String(k))] = _sanitizeAuditArgs(o[k], d + 1) })
        return _r
      }
      return o
    }
    // OpenAF's HTTP server doesn't expose the raw socket's remote address to oJob, only headers -- so the "original"
    // client IP is best-effort and only available when a reverse proxy sets X-Forwarded-For/X-Real-IP
    var _getClientMeta = req => {
      var _xff = _getHeader(req, "x-forwarded-for")
      var _ip  = isString(_xff) ? _xff.split(",")[0].trim() : _getHeader(req, "remote-addr")
      var _hip = _getHeader(req, "http-client-ip")
      var _ua  = _getHeader(req, "user-agent")
      return { ip: _sanitizeAuditVal(_ip), hip: _sanitizeAuditVal(_hip), ua: _sanitizeAuditVal(_ua) }
    }
    var _auditLog = (toolName, toolArgs, req) => {
      if (!_auditEnabled) return
      var _client = _getClientMeta(req)
      var _entry = { server: _auditServer, tool: _sanitizeAuditVal(String(toolName)), args: isMap(toolArgs) ? _sanitizeAuditArgs(toolArgs) : {} }
      if (isString(_client.ip) && _client.ip.length > 0) _entry.ip = _client.ip
      if (isString(_client.hip) && _client.hip.length > 0) _entry.hip = _client.hip
      if (isString(_client.ua) && _client.ua.length > 0) _entry.ua = _client.ua
      log("[audit] " + af.toSLON(_entry))
    }

    var _readToolsEnv = envName => isDef(getEnv(envName)) ? af.fromJSSLON('{"tools":' + getEnv(envName) + '}').tools : []
    var _toolsInclude = _readToolsEnv("OJOB_MCP_TOOLS_INCLUDE")
    var _toolsExclude = _readToolsEnv("OJOB_MCP_TOOLS_EXCLUDE")
    _$( _toolsInclude, "OJOB_MCP_TOOLS_INCLUDE").isArray().$_("OJOB_MCP_TOOLS_INCLUDE must be a JSON/SLON array")
    _$( _toolsExclude, "OJOB_MCP_TOOLS_EXCLUDE").isArray().$_("OJOB_MCP_TOOLS_EXCLUDE must be a JSON/SLON array")
    _toolsInclude.forEach(n => _$(n, "OJOB_MCP_TOOLS_INCLUDE entry").isString().$_("OJOB_MCP_TOOLS_INCLUDE entries must be strings"))
    _toolsExclude.forEach(n => _$(n, "OJOB_MCP_TOOLS_EXCLUDE entry").isString().$_("OJOB_MCP_TOOLS_EXCLUDE entries must be strings"))

    fns = {}

    var _applyTemplateToDescriptions = meta => _applyTemplate(meta, false)

    var _prefixToolName = n => (isString(args.toolPrefix) && args.toolPrefix.length > 0 ? args.toolPrefix + n : n)
    var _resolveToolName = n => {
      if (isString(args.toolPrefix) && args.toolPrefix.length > 0 && isString(n) && n.startsWith(args.toolPrefix)) {
        return n.substring(args.toolPrefix.length)
      }
      return n
    }
    var _isToolEnabled = f => (_toolsInclude.length == 0 || _toolsInclude.indexOf(f) >= 0) && _toolsExclude.indexOf(f) < 0
    var _toToolMeta = f => {
      var _meta
      if (isDef(args.fnsMeta[f])) {
        _meta = _applyTemplateToDescriptions(clone(args.fnsMeta[f]))
      } else {
        _meta = {
          name       : f,
          description: f,
          inputSchema: {}
        }
      }
      if (!isMap(_meta)) _meta = { name: f, description: String(_meta), inputSchema: {} }
      _meta.name = _prefixToolName(f)
      return _meta
    }

    if (args.usestream) {
      fns[args.uri] = req => {
        try {
          var _rpcFns = {
              initialize                 : params => {
                  if (args.debug) log(`initialize -- ${af.toCSLON(params)}`)
                  return args.description
              },
              "notifications/cancelled"  : params => ({}),
              "notifications/initialized": params => ({}),
              "ping"                     : params => {
                  if (args.debug) log(`ping -- ${af.toCSLON(params)}`)
                  return {}
              },
              "tools/call"               : params => {
                  if (args.debug) log(`tools/call -- ${af.toCSLON(params)}`)
                  var _res
                  var _toolName = _resolveToolName(params.name)
                  var _known    = _isToolEnabled(_toolName) && isDef(args.fns[_toolName])
                  // Only a resolved, enabled tool may fire a hook: an unknown name is attacker-controlled
                  // and unbounded, and must not be turned into a POST on the audit receiver
                  var _hookContext = (_hookEnabled && _known)
                    ? _startHook(_toolName, params.name, params.arguments || params.input || {}, _getClientMeta(req), _hookHeaders(req))
                    : __
                  _auditLog(_toolName, params.arguments || params.input || {}, req)
                  if (_known) {
                    try {
                      if (isString(args.fns[_toolName])) {
                        _res = $job(args.fns[_toolName], merge({ _httprequest: _scrubAuthHeader(req) }, params.arguments || params.input || {}))
                        if (isMap(_res)) {
                          delete _res.objId
                          delete _res.execid
                          // Never echo the request (cookies, api keys, auth header) back to the caller
                          delete _res._httprequest
                          // Check for _err and treat it as an error
                          if (isDef(_res._err)) {
                            var errMsg = _res._err
                            delete _res._err
                            logErr(`Error executing tool '${params.name}': ${errMsg}`)
                            _res = {
                                content: [{
                                    type: "text",
                                    text: String(errMsg)
                                }],
                                isError: true
                            }
                          }
                        }
                      } else {
                        throw "Function not found: " + _toolName
                      }
                    } catch(e) {
                      logErr(`Error executing tool '${params.name}': ${e.message}`)
                      _res = {
                          content: [{
                              type: "text",
                              text: `Error executing tool '${params.name}': ${e.message}`
                          }],
                          isError: true
                      }
                      $err(e)
                    }
                  } else {
                    _res = {
                        content: [{
                            type: "text",
                            text: `Error: Unknown tool '${params.name}'`
                        }],
                        isError: true
                    }
                  }
                  try {
                  if (isDef(_res) && _res.isError !== true && isString(_res.text)) {
                    _res = {
                        content: [{
                            type: "text",
                            text: _res.text
                        }],
                        isError: false
                    }
                  } else if (isDef(_res) && _res.isError !== true && isUnDef(_res.result)) {
                    _res = {
                        content: [{
                            type: "text",
                            text: isDef(__flags.MCPSERVER) && __flags.MCPSERVER.answerInTOON ? af.toTOON(_res) : stringify(_res, __, "")
                        }],
                        isError: false
                    }
                  } else {
                    if (isDef(_res) && _res.isError !== true) _res = _res.result
                  }
                  } catch(eee) { $err(eee) }

                  _endHook(_hookContext, _res)
                  if (args.debug) log(`tools/call -- response: ${af.toCSLON(_res)}`)
                  return _res
              },
              "tools/list": params => {
                  if (args.debug) log(`tools/list -- ${af.toCSLON(params)}`)
                  var _fnsMeta = Object.keys(args.fns).filter(_isToolEnabled).map(f => _toToolMeta(f))
                  return {
                      tools: _fnsMeta
                  }
              },
              "prompts/list": params => ({})
          }
          if (args.modern) _rpcFns["server/discover"] = params => ow.server.mcp.discoverResult(args.description)

          // Process the JSON-RPC request
          var _rpcRes = ow.server.httpd.replyJSONRPC(global.__ojobHttp[args.port], req, _rpcFns, log, m => { if (args.debug) print(ansiColor("BG(230),BLACK", m)) }, { modern: args.modern, serverInfo: args.description.serverInfo })
          
          // Parse request to check if it's a notification
          var body = (isDef(req.files) && isDef(req.files.postData)) ? req.files.postData : __
          if (isUnDef(body) && isDef(req.data)) body = req.data
          
          var reqObj
          try {
            reqObj = jsonParse(body)
          } catch(e) {
            return { data: "Invalid JSON", mimetype: "text/plain", status: 400, header: {} }
          }

          // For notifications (no id field), return 204 No Content immediately
          if (isUnDef(reqObj.id)) {
            if (args.debug) log("Notification received: " + reqObj.method)
            return { data: "", mimetype: "text/plain", status: 204, header: {} }
          }

          // For requests with id, return SSE stream
          var pis = new java.io.PipedInputStream()
          var pos = new java.io.PipedOutputStream(pis)

          $doV(function() {
            try {
              var _payload = _rpcRes
              if (isMap(_rpcRes) && isDef(_rpcRes.data)) _payload = _rpcRes.data
              if (isString(_payload)) {
                try { _payload = jsonParse(_payload) } catch(__e) {}
              }
              
              if (isDef(_payload) && _payload !== "") {
                var msg = "event: message\n"
                msg += "data: " + (isDef(__flags.MCPSERVER) && __flags.MCPSERVER.answerInTOON ? af.toTOON(_payload) : JSON.stringify(_payload)) + "\n\n"
                pos.write(af.fromString2Bytes(msg))
                pos.flush()
              }
            } catch(e) {
              try {
                var errMsg = "event: error\n"
                errMsg += "data: " + JSON.stringify({ message: String(e) }) + "\n\n"
                pos.write(af.fromString2Bytes(errMsg))
                pos.flush()
              } catch(e2) {
                logErr("MCP stream error: " + String(e2))
              }
            } finally {
              try { pos.close() } catch(e) {}
            }
          })

          return {
            status  : 200,
            mimetype: "text/event-stream",
            stream  : pis,
            header  : {
              "Cache-Control"    : "no-cache, no-transform",
              "Connection"       : "keep-alive",
              "Content-Encoding" : "identity",
              "X-Accel-Buffering": "no"
            }
          }
        } catch(e) {
          return { data: String(e), mimetype: "text/plain", status: 500, header: {} }
        }
      }
    } else {
      fns[args.uri] = req => {
        var _rpcFns = {
            initialize                 : params => {
                if (args.debug) log(`initialize -- ${af.toCSLON(params)}`)
                return args.description
            },
            "notifications/cancelled"  : params => ({}),
            "notifications/initialized": params => ({}),
            "ping"                     : params => {
                if (args.debug) log(`ping -- ${af.toCSLON(params)}`)
                return {}
            },
            "tools/call"               : params => {
                if (args.debug) log(`tools/call -- ${af.toCSLON(params)}`)
                var _res
                var _toolName = _resolveToolName(params.name)
                var _known    = _isToolEnabled(_toolName) && isDef(args.fns[_toolName])
                // Only a resolved, enabled tool may fire a hook: an unknown name is attacker-controlled
                // and unbounded, and must not be turned into a POST on the audit receiver
                var _hookContext = (_hookEnabled && _known)
                  ? _startHook(_toolName, params.name, params.arguments || params.input || {}, _getClientMeta(req), _hookHeaders(req))
                  : __
                _auditLog(_toolName, params.arguments || params.input || {}, req)
                if (_known) {
                  try {
                    if (isString(args.fns[_toolName])) {
                      _res = $job(args.fns[_toolName], merge({ _httprequest: _scrubAuthHeader(req) }, params.arguments || params.input || {}))
                      if (isMap(_res)) {
                        delete _res.objId
                        delete _res.execid
                        // Never echo the request (cookies, api keys, auth header) back to the caller
                        delete _res._httprequest
                        // Check for _err and treat it as an error
                        if (isDef(_res._err)) {
                          var errMsg = _res._err
                          delete _res._err
                          logErr(`Error executing tool '${params.name}': ${errMsg}`)
                          _res = {
                              content: [{
                                  type: "text",
                                  text: String(errMsg)
                              }],
                              isError: true
                          }
                        }
                      }
                    } else {
                      throw "Function not found: " + _toolName
                    }
                  } catch(e) {
                    logErr(`Error executing tool '${params.name}': ${e.message}`)
                    _res = {
                        content: [{
                            type: "text",
                            text: `Error executing tool '${params.name}': ${e.message}`
                        }],
                        isError: true
                    }
                    $err(e)
                  }
                } else {
                  _res = {
                      content: [{
                          type: "text",
                          text: `Error: Unknown tool '${params.name}'`
                      }],
                      isError: true
                  }
                }
                try {
                if (isDef(_res) && _res.isError !== true && isString(_res.text)) {
                  _res = {
                      content: [{
                          type: "text",
                          text: _res.text
                      }],
                      isError: false
                  }
                } else if (isDef(_res) && _res.isError !== true && isUnDef(_res.result)) {
                  _res = {
                      content: [{
                          type: "text",
                          text: (isDef(__flags.MCPSERVER) && __flags.MCPSERVER.answerInTOON ? af.toTOON(_res) : stringify(_res, __, ""))
                      }],
                      isError: false
                  }
                } else {
                  if (isDef(_res) && _res.isError !== true) _res = _res.result
                }
                } catch(eee) { $err(eee) }

                _endHook(_hookContext, _res)
                if (args.debug) log(`tools/call -- response: ${af.toCSLON(_res)}`)
                return _res
            },
            "tools/list": params => {
                if (args.debug) log(`tools/list -- ${af.toCSLON(params)}`)
                var _fnsMeta = Object.keys(args.fns).filter(_isToolEnabled).map(f => _toToolMeta(f))
                return {
                    tools: _fnsMeta
                }
            },
            "prompts/list": params => ({})
        }
        if (args.modern) _rpcFns["server/discover"] = params => ow.server.mcp.discoverResult(args.description)

        return ow.server.httpd.replyJSONRPC(global.__ojobHttp[args.port], req, _rpcFns, log, m => { if (args.debug) print(ansiColor("BG(230),BLACK", m)) }, { modern: args.modern, serverInfo: args.description.serverInfo })
      }
    }

    // Wraps the MCP endpoint with a bearer-token check when auth is configured; no-op otherwise
    if (_authEnabled) {
      var _innerFn = fns[args.uri]
      fns[args.uri] = req => {
        var _hdr = isMap(req) && isMap(req.header) ? req.header[_authHeader] : __
        var _valid = _authApiEnabled ? _authCheckExternal(_hdr) : _authCheck(_hdr)
        if (!_valid) return _authReject()
        return _innerFn(req)
      }
    }

    // Add handler for .well-known endpoint (optional OAuth discovery)
    /*fns[args.uri + "/.well-known/oauth-authorization-server"] = req => {
      return { data: "{}", mimetype: "application/json", status: 404, header: {} }
    }*/

    ow.server.httpd.route(global.__ojobHttp[args.port], merge(global.__ojobRoutes[args.port], fns))
    log("READY [" + args.port + "]")

# --------------------------
- name    : STDIO MCP Server
  typeArgs:
    noLog   : false 
    shortcut:
      name  : stdioMCP
      keyArg: description
      args  :
        debug      : debug
        tplDesc    : tplDesc
        toolPrefix : toolPrefix
        fnsMeta    : fnsMeta
        fns        : fns
        audit      : audit
        modern     : modern
  help    :
    text: Starts a MCP stdio to handle requests with execution of jobs.
    expects:
    - name: debug
      desc: (String) If defined it will create a ndjson file with the provided name.
    - name: fnsMeta
      desc: (Map) Metadata for the functions available in the MCP server stdio.
    - name: tplDesc
      desc: (Boolean) If true, all tool description fields in fnsMeta are evaluated as handlebars templates with the current oJob args.
    - name: toolPrefix
      desc: (String) If defined, prefixes exposed MCP tool names without changing fns/fnsMeta key mapping.
    - name: fns
      desc: (Map) Functions to be executed when called from the MCP server stdio.
    - name: audit
      desc: (Boolean) If true (or env OJOB_MCP_AUDIT), logs every tool call (tool name and arguments) via OpenAF's log() function. Default false (no auditing).
    - name: modern
      desc: (Boolean) If true (or env OJOB_MCP_MODERN), also serves the 2026-07-28 stateless/per-request MCP protocol era side-by-side with the legacy initialize-handshake era. Default is false, so previous (legacy-only) behavior is unchanged unless explicitly opted in.
  check   :
    in:
      description: isMap.default(__)
      debug      : isString.default(__)
      tplDesc    : toBoolean.isBoolean.default(false)
      toolPrefix : isString.default("")
      fnsMeta    : isMap.default({})
      fns        : isMap.default({})
      audit      : default(__)
      modern     : default(__)
  exec    : | #js
    var _applyTemplate = (meta, allStrings) => {
      if (!args.tplDesc) return meta
      var _walk = obj => {
        if (isString(obj) && allStrings) return $t(obj, args)
        if (isArray(obj)) return obj.map(_walk)
        if (isMap(obj)) {
          Object.keys(obj).forEach(k => {
            if (isString(obj[k]) && (allStrings || k == "description")) {
              obj[k] = $t(obj[k], args)
            } else {
              obj[k] = _walk(obj[k])
            }
          })
        }
        return obj
      }
      return _walk(meta)
    }

    // Ensures default server info and capabilities
    args.description = merge({
      protocolVersion: "2024-11-05",
      serverInfo: {
          name: "OpenAF",
          title: "OpenAF server",
          version: "1.0.0"
      },
      capabilities: {
          prompts: {
              listChanged: true
          },
          tools: {
              listChanged: true
          }
      }
    }, args.description)
    args.description = _applyTemplate(clone(args.description), true)

    // Opt-in support for the 2026-07-28 stateless/per-request MCP protocol era, side-by-side with the legacy
    // initialize-handshake era above (which stays the default and is left fully unchanged when modern is false).
    args.modern = toBoolean(_$(args.modern).default(getEnv("OJOB_MCP_MODERN") || "false"))

    var _readToolsEnv = envName => isDef(getEnv(envName)) ? af.fromJSSLON('{"tools":' + getEnv(envName) + '}').tools : []
    var _toolsInclude = _readToolsEnv("OJOB_MCP_TOOLS_INCLUDE")
    var _toolsExclude = _readToolsEnv("OJOB_MCP_TOOLS_EXCLUDE")
    _$( _toolsInclude, "OJOB_MCP_TOOLS_INCLUDE").isArray().$_("OJOB_MCP_TOOLS_INCLUDE must be a JSON/SLON array")
    _$( _toolsExclude, "OJOB_MCP_TOOLS_EXCLUDE").isArray().$_("OJOB_MCP_TOOLS_EXCLUDE must be a JSON/SLON array")
    _toolsInclude.forEach(n => _$(n, "OJOB_MCP_TOOLS_INCLUDE entry").isString().$_("OJOB_MCP_TOOLS_INCLUDE entries must be strings"))
    _toolsExclude.forEach(n => _$(n, "OJOB_MCP_TOOLS_EXCLUDE entry").isString().$_("OJOB_MCP_TOOLS_EXCLUDE entries must be strings"))

    // Optional per-tool-call audit logging (opt-in; fails closed/off by default; logs via OpenAF's log() function)
    var _auditEnabled = toBoolean(_$(args.audit).default(getEnv("OJOB_MCP_AUDIT") || "false"))
    var _auditServer  = isMap(args.description) && isMap(args.description.serverInfo) ? args.description.serverInfo.name : "mcp"
    // Sanitizes attacker-controlled values before they reach the audit log (strips CR/LF, caps length)
    var _sanitizeAuditVal = v => isString(v) ? v.replace(/[\r\n]/g, " ").substring(0, 256) : __
    // Tool arguments are attacker-controlled too, so scrub string leaves and keys before they reach the
    // log. This copy is for logging only -- the tool job and the audit webhooks still get the raw values.
    var _sanitizeAuditArgs = (o, d) => {
      d = isDef(d) ? d : 0
      if (d > 8) return "..."
      if (isString(o)) return _sanitizeAuditVal(o)
      if (isArray(o)) return o.map(v => _sanitizeAuditArgs(v, d + 1))
      if (isMap(o)) {
        var _r = {}
        Object.keys(o).forEach(k => { _r[_sanitizeAuditVal(String(k))] = _sanitizeAuditArgs(o[k], d + 1) })
        return _r
      }
      return o
    }

    // Optional best-effort audit webhooks. Snapshot before scheduling to isolate mutable job args.
    var _preHookURL = String(getEnv("OJOB_MCP_PREHOOK_URL") || "").trim()
    var _postHookURL = String(getEnv("OJOB_MCP_POSTHOOK_URL") || "").trim()
    var _hookIncludeArgs = String(getEnv("OJOB_MCP_HOOK_INCLUDE_ARGS") || "").trim().toLowerCase() === "true"
    var _hookIncludeResult = String(getEnv("OJOB_MCP_HOOK_INCLUDE_RESULT") || "").trim().toLowerCase() === "true"
    // Request headers are never attached unless explicitly opted in; the auth credential is stripped either way
    var _hookIncludeHeaders = String(getEnv("OJOB_MCP_HOOK_INCLUDE_HEADERS") || "").trim().toLowerCase() === "true"
    var _hookTimeout = Number(getEnv("OJOB_MCP_HOOK_TIMEOUT") || 5000)
    if (!isFinite(_hookTimeout) || _hookTimeout <= 0) _hookTimeout = 5000
    // $doV is unbounded (virtual threads), so without a cap a slow/hanging receiver lets every tool call
    // pile up an outstanding delivery and socket -- deliveries above the cap are dropped, never queued
    var _hookMaxInFlight = Number(getEnv("OJOB_MCP_HOOK_MAX_INFLIGHT") || 64)
    if (!isFinite(_hookMaxInFlight) || _hookMaxInFlight <= 0) _hookMaxInFlight = 64
    // Hard ceiling on a single event body; an oversized event is sent as metadata only
    var _hookMaxBody = Number(getEnv("OJOB_MCP_HOOK_MAX_BODY") || 65536)
    if (!isFinite(_hookMaxBody) || _hookMaxBody <= 0) _hookMaxBody = 65536
    // Optional credential so the receiver can authenticate the events it is sent
    var _hookAuthToken = String(getEnv("OJOB_MCP_HOOK_AUTH_TOKEN") || "").trim()
    var _hookAuthHeader = String(getEnv("OJOB_MCP_HOOK_AUTH_HEADER") || "authorization").trim()
    var _hookAuthScheme = String(getEnv("OJOB_MCP_HOOK_AUTH_SCHEME") || "Bearer").trim()
    var _hookEnabled = _preHookURL.length > 0 || _postHookURL.length > 0
    if (_hookEnabled) ow.loadObj()
    var _hookInFlight = $atomic(0, "long")
    var _hookFailure = () => { try { logErr("MCP audit webhook delivery failed") } catch(ignore) {} }
    var _hookDropped = () => { try { logErr("MCP audit webhook dropped (in-flight cap reached)") } catch(ignore) {} }
    // Copies request headers for the receiver minus the MCP auth credential. Unlike _scrubAuthHeader this
    // strips case-insensitively and unconditionally, so the secret never leaves the process through a hook.
    var _hookHeaders = req => {
      if (!_hookIncludeHeaders || !isMap(req) || !isMap(req.header)) return __
      var _n = String(isString(args.authheader) && args.authheader.length > 0
                      ? args.authheader
                      : (getEnv("OJOB_MCP_AUTH_HEADER") || "authorization")).toLowerCase()
      var _h = {}
      Object.keys(req.header).forEach(k => {
        var _lk = String(k).toLowerCase()
        if (_lk != _n && _lk != "authorization") _h[k] = req.header[k]
      })
      return _h
    }
    // Keeps a single event from becoming an arbitrarily large POST on the audit receiver
    var _hookBody = event => {
      var _body = stringify(event, __, "")
      if (isString(_body) && _body.length > _hookMaxBody) {
        var _trimmed = merge({}, event)
        delete _trimmed.arguments
        delete _trimmed.result
        delete _trimmed.error
        delete _trimmed.headers
        _trimmed.truncated = true
        _body = stringify(_trimmed, __, "")
      }
      return _body
    }
    var _sendHook = (url, event) => {
      if (!url) return
      if (_hookInFlight.inc() > _hookMaxInFlight) { _hookInFlight.dec(); _hookDropped(); return }
      try {
        var body = _hookBody(event)
        var _hdrs = { "Content-Type": "application/json" }
        if (_hookAuthToken.length > 0) _hdrs[_hookAuthHeader] = (_hookAuthScheme.length > 0 ? _hookAuthScheme + " " : "") + _hookAuthToken
        $doV(() => {
          try {
            var response = (new ow.obj.http()).exec(url, "POST", body,
              _hdrs, false, _hookTimeout, false, { timeout: _hookTimeout })
            if (!isMap(response) || response.responseCode < 200 || response.responseCode >= 300) _hookFailure()
          } catch(e) {
            _hookFailure()
          } finally {
            _hookInFlight.dec()
          }
        }, _hookFailure)
      } catch(e) { _hookInFlight.dec(); _hookFailure() }
    }
    var _startHook = (tool, wireTool, toolArgs, client, headers) => {
      if (!_hookEnabled) return __
      try {
        var context = {
          callId: genUUID(), startedAt: now(), server: args.description.serverInfo,
          transport: "stdio", tool: tool, wireTool: wireTool,
          argumentCount: isMap(toolArgs) ? Object.keys(toolArgs).length : 0
        }
        if (_hookIncludeArgs) context.arguments = toolArgs
        if (isDef(client)) context.client = client
        if (isDef(headers)) context.headers = headers
        // Retain an independent snapshot for post-only configurations too.
        context = JSON.parse(stringify(context, __, ""))
        _sendHook(_preHookURL, merge(context, { phase: "pre", timestamp: context.startedAt }))
        return context
      } catch(e) { _hookFailure(); return __ }
    }
    var _endHook = (context, result, error) => {
      if (isUnDef(context) || !_postHookURL) return
      try {
        var finishedAt = now()
        var event = merge(context, {
          phase: "post", timestamp: finishedAt, durationMs: finishedAt - context.startedAt,
          isError: isDef(error) || (isMap(result) && result.isError === true)
        })
        if (_hookIncludeResult && isDef(error)) event.error = String(isDef(error.message) ? error.message : error)
        if (_hookIncludeResult && isDef(result)) event.result = result
        _sendHook(_postHookURL, event)
      } catch(e) { _hookFailure() }
    }
    var _auditLog = (toolName, toolArgs) => {
      if (!_auditEnabled) return
      log("[audit] " + af.toSLON({ server: _auditServer, tool: _sanitizeAuditVal(String(toolName)), args: isMap(toolArgs) ? _sanitizeAuditArgs(toolArgs) : {} }))
    }

    var fs = {}
    var _applyTemplateToDescriptions = meta => _applyTemplate(meta, false)

    var _prefixToolName = n => (isString(args.toolPrefix) && args.toolPrefix.length > 0 ? args.toolPrefix + n : n)
    var _resolveToolName = n => {
      if (isString(args.toolPrefix) && args.toolPrefix.length > 0 && isString(n) && n.startsWith(args.toolPrefix)) {
        return n.substring(args.toolPrefix.length)
      }
      return n
    }
    var _isToolEnabled = f => (_toolsInclude.length == 0 || _toolsInclude.indexOf(f) >= 0) && _toolsExclude.indexOf(f) < 0
    var _toToolMeta = f => {
      var _meta
      if (isDef(args.fnsMeta[f])) {
        _meta = _applyTemplateToDescriptions(clone(args.fnsMeta[f]))
      } else {
        _meta = {
          name       : f,
          description: f,
          inputSchema: {}
        }
      }
      if (!isMap(_meta)) _meta = { name: f, description: String(_meta), inputSchema: {} }
      _meta.name = _prefixToolName(f)
      return _meta
    }

    Object.keys(args.fns).filter(_isToolEnabled).forEach(f => {
      var _toolName = _prefixToolName(f)
      fs[_toolName] = function(params) {
        var _jobName = _resolveToolName(_toolName)
        var _hookContext = _startHook(_jobName, _toolName, params)
        try {
          _auditLog(_jobName, params)
          var _r = $job(args.fns[_jobName], params)
          if (isMap(_r)) {
            delete _r.objId
            delete _r.execid
            // Check for _err and treat it as an error
            if (isDef(_r._err)) {
              var errMsg = _r._err
              delete _r._err
              throw String(errMsg)
            }
          }
          _endHook(_hookContext, _r)
          return _r
        } catch(e) {
          _endHook(_hookContext, __, e)
          throw e
        }
      }
    })

    ow.server.mcpStdio(args.description, Object.keys(args.fns).filter(_isToolEnabled).map(f => _toToolMeta(f)),
      fs,
      (type, msg) => {
      if (args.debug) {
        io.writeLineNDJSON(args.debug, { type: type, msg: msg })
      }
    },
    { modern: args.modern })


