# Copyright 2025 Nuno Aguiar
# MCP Server Job
# This job starts a MCP server that listens for requests and executes jobs based on the requests.

include:
- oJobHTTPd.yaml

jobs:
# -------------------------
- name    : HTTP MCP Server
  typeArgs:
    noLog   : false 
    shortcut:
      name  : httpdMCP
      keyArg: port
      args  :
        description  : description
        uri          : uri
        usestream    : usestream
        debug        : debug
        tplDesc      : tplDesc
        toolPrefix   : toolPrefix
        fnsMeta      : fnsMeta
        fns          : fns
        authtoken      : authtoken
        authheader     : authheader
        authscheme     : authscheme
        authrealm      : authrealm
        authchallenge  : authchallenge
        authapiurl     : authapiurl
        authapimethod  : authapimethod
        authapitimeout : authapitimeout
        authapicachettl: authapicachettl
        audit          : audit
  help    :
    text: Starts a MCP server to handle requests with execution of jobs.
    expects:
    - name: port
      desc: (Number) The port to listen on.
    - name: uri
      desc: (String) The URI to handle requests. Default is "/mcp".
    - name: usestream
      desc: (Boolean) If true, returns responses as HTTP SSE stream events.
    - name: debug
      desc: (Boolean) If true, debug messages will be logged.
    - name: tplDesc
      desc: (Boolean) If true, all tool description fields in fnsMeta are evaluated as handlebars templates with the current oJob args.
    - name: toolPrefix
      desc: (String) If defined, prefixes exposed MCP tool names without changing fns/fnsMeta key mapping.
    - name: fnsMeta
      desc: (Map) Metadata for the functions available in the MCP server.
    - name: fns
      desc: (Map) Functions to be executed when called from the MCP server.
    - name: authtoken
      desc: (String) If defined (or env OJOB_MCP_AUTH_TOKEN), requires this bearer token on every request to this MCP endpoint. If not defined, no authentication is enforced (default behavior).
    - name: authheader
      desc: (String) The request header to read the credential from (default "authorization", or env OJOB_MCP_AUTH_HEADER).
    - name: authscheme
      desc: (String) The authorization scheme prefix expected before the token (default "Bearer", or env OJOB_MCP_AUTH_SCHEME).
    - name: authrealm
      desc: (String) The realm reported in the WWW-Authenticate challenge (default is the MCP server's name, or env OJOB_MCP_AUTH_REALM).
    - name: authchallenge
      desc: (Boolean) If true (default), unauthenticated/unauthorized requests receive a WWW-Authenticate header (or env OJOB_MCP_AUTH_CHALLENGE).
    - name: authapiurl
      desc: (String) If defined (or env OJOB_MCP_AUTH_API_URL), validates the bearer credential by calling this URL instead of comparing it against authtoken. The incoming auth header is forwarded verbatim (same header name and value, including scheme). A 2xx response means valid; any other response, or a request error/timeout, means invalid (fails closed). Mutually exclusive with authtoken -- if both are defined, authapiurl takes precedence.
    - name: authapimethod
      desc: (String) The HTTP method used for the authapiurl validation call (default "GET", or env OJOB_MCP_AUTH_API_METHOD).
    - name: authapitimeout
      desc: (Number) Timeout in milliseconds for the authapiurl validation call (default 5000, or env OJOB_MCP_AUTH_API_TIMEOUT).
    - name: authapicachettl
      desc: (Number) If greater than 0, caches a token's authapiurl validation result in memory for this many milliseconds to avoid calling the validation service on every request (default 0, disabled; or env OJOB_MCP_AUTH_API_CACHE_TTL).
    - name: audit
      desc: (Boolean) If true (or env OJOB_MCP_AUDIT), logs every tool call (tool name, arguments, User-Agent and, when available, client IP) via OpenAF's log() function. The IP is best-effort, read from the X-Forwarded-For/X-Real-IP request headers, since OpenAF's HTTP server does not expose the raw socket address -- it is only populated when a reverse proxy sets one of those headers. Default false (no auditing).
  check   :
    in:
      description  : isMap.default(__)
      port         : isNumber
      uri          : isString.default("/mcp")
      usestream    : toBoolean.isBoolean.default(false)
      debug        : toBoolean.isBoolean.default(false)
      tplDesc      : toBoolean.isBoolean.default(false)
      toolPrefix   : isString.default("")
      fnsMeta      : isMap.default({})
      fns          : isMap.default({})
      authtoken      : isString.default(__)
      authheader     : isString.default(__)
      authscheme     : isString.default(__)
      authrealm      : isString.default(__)
      authchallenge  : isString.default(__)
      authapiurl     : isString.default(__)
      authapimethod  : isString.default(__)
      authapitimeout : default(__)
      authapicachettl: default(__)
      audit          : default(__)
  deps    :
  - HTTP Start Server
  exec    : | #js
    var _applyTemplate = (meta, allStrings) => {
      if (!args.tplDesc) return meta
      var _walk = obj => {
        if (isString(obj) && allStrings) return $t(obj, args)
        if (isArray(obj)) return obj.map(_walk)
        if (isMap(obj)) {
          Object.keys(obj).forEach(k => {
            if (isString(obj[k]) && (allStrings || k == "description")) {
              obj[k] = $t(obj[k], args)
            } else {
              obj[k] = _walk(obj[k])
            }
          })
        }
        return obj
      }
      return _walk(meta)
    }

    // Ensures default server info and capabilities
    args.description = merge({
      protocolVersion: "2024-11-05",
      serverInfo: {
          name: "OpenAF",
          title: "OpenAF MCP server",
          version: "1.0.0"
      },
      capabilities: {
          prompts: {
              listChanged: true
          },
          tools: {
              listChanged: true
          }
      }
    }, args.description)
    args.description = _applyTemplate(clone(args.description), true)

    // Optional bearer-token authentication for this HTTP MCP endpoint (opt-in; fails open when unconfigured)
    var _authToken     = _$(args.authtoken).default(getEnv("OJOB_MCP_AUTH_TOKEN"))
    var _authHeader    = String(_$(args.authheader).default(getEnv("OJOB_MCP_AUTH_HEADER") || "authorization")).toLowerCase()
    var _authScheme    = _$(args.authscheme).default(getEnv("OJOB_MCP_AUTH_SCHEME") || "Bearer")
    var _authRealm     = _$(args.authrealm).default(getEnv("OJOB_MCP_AUTH_REALM") || args.description.serverInfo.name)
    var _authChallenge = toBoolean(_$(args.authchallenge).default(getEnv("OJOB_MCP_AUTH_CHALLENGE") || "true"))

    // Optional external HTTP-based token validation (opt-in; mutually exclusive with authtoken -- takes precedence when both are set)
    var _authApiUrl      = _$(args.authapiurl).default(getEnv("OJOB_MCP_AUTH_API_URL"))
    var _authApiMethod   = _$(args.authapimethod).default(getEnv("OJOB_MCP_AUTH_API_METHOD") || "GET")
    var _authApiTimeout  = Number(_$(args.authapitimeout).default(getEnv("OJOB_MCP_AUTH_API_TIMEOUT") || 5000))
    var _authApiCacheTTL = Number(_$(args.authapicachettl).default(getEnv("OJOB_MCP_AUTH_API_CACHE_TTL") || 0))
    var _authApiEnabled  = isString(_authApiUrl) && _authApiUrl.length > 0
    var _authApiCache    = {}

    var _authEnabled   = _authApiEnabled || (isString(_authToken) && _authToken.length > 0)

    var _authCheck = headerValue => {
      if (!isString(headerValue)) return false
      var _m = headerValue.match(new RegExp("^" + _authScheme + "\\s+(.+)$", "i"))
      if (isNull(_m)) return false
      return sha512(_m[1]) == sha512(_authToken)
    }

    // Validates the credential by forwarding it, unchanged, to an external HTTP service; a 2xx response means valid.
    // Fails closed: any non-2xx response, request error, or timeout is treated as invalid.
    var _authCheckExternal = headerValue => {
      if (!isString(headerValue)) return false
      var _m = headerValue.match(new RegExp("^" + _authScheme + "\\s+(.+)$", "i"))
      if (isNull(_m)) return false

      var _key = sha512(headerValue)
      if (_authApiCacheTTL > 0 && isDef(_authApiCache[_key]) && _authApiCache[_key].exp > now()) {
        return _authApiCache[_key].ok
      }

      var _ok = false
      try {
        ow.loadObj()
        var _hdrs = {}
        _hdrs[_authHeader] = headerValue
        var _res = (new ow.obj.http()).exec(_authApiUrl, _authApiMethod, "", _hdrs, false, _authApiTimeout)
        _ok = isMap(_res) && _res.responseCode >= 200 && _res.responseCode < 300
      } catch(e) {
        if (args.debug) logErr("MCP auth API validation error: " + e.message)
        _ok = false
      }

      if (_authApiCacheTTL > 0) _authApiCache[_key] = { ok: _ok, exp: now() + _authApiCacheTTL }
      return _ok
    }

    var _authReject = () => {
      var _hdrs = {}
      if (_authChallenge) _hdrs["WWW-Authenticate"] = _authScheme + " realm=\"" + _authRealm + "\""
      return {
        data    : stringify({ jsonrpc: "2.0", error: { code: -32001, message: "Unauthorized" } }, __, ""),
        mimetype: "application/json",
        status  : 401,
        header  : _hdrs
      }
    }

    // Strips the auth credential before it reaches tool jobs (avoids leaking the shared secret via echoed args/errors)
    var _scrubAuthHeader = req => {
      if (!_authEnabled || !isMap(req) || !isMap(req.header)) return req
      var _r = merge({}, req)
      _r.header = merge({}, req.header)
      delete _r.header[_authHeader]
      delete _r.header.authorization
      return _r
    }

    // Optional per-tool-call audit logging (opt-in; fails closed/off by default; logs via OpenAF's log() function)
    var _auditEnabled = toBoolean(_$(args.audit).default(getEnv("OJOB_MCP_AUDIT") || "false"))
    var _auditServer  = isMap(args.description) && isMap(args.description.serverInfo) ? args.description.serverInfo.name : "mcp"
    // Header lookup is case-insensitive: the JDK-backed impl preserves "User-Agent" casing while the default nano-based impl lowercases it
    var _getHeader = (req, name) => {
      if (!isMap(req) || !isMap(req.header)) return __
      var _k = Object.keys(req.header).filter(k => k.toLowerCase() == name.toLowerCase())
      return _k.length > 0 ? req.header[_k[0]] : __
    }
    // Sanitizes attacker-controlled header values before they reach the audit log (strips CR/LF, caps length)
    var _sanitizeAuditVal = v => isString(v) ? v.replace(/[\r\n]/g, " ").substring(0, 256) : __
    // OpenAF's HTTP server doesn't expose the raw socket's remote address to oJob, only headers -- so the "original"
    // client IP is best-effort and only available when a reverse proxy sets X-Forwarded-For/X-Real-IP
    var _getClientMeta = req => {
      var _xff = _getHeader(req, "x-forwarded-for")
      var _ip  = isString(_xff) ? _xff.split(",")[0].trim() : _getHeader(req, "remote-addr")
      var _hip = _getHeader(req, "http-client-ip")
      var _ua  = _getHeader(req, "user-agent")
      return { ip: _sanitizeAuditVal(_ip), hip: _sanitizeAuditVal(_hip), ua: _sanitizeAuditVal(_ua) }
    }
    var _auditLog = (toolName, toolArgs, req) => {
      if (!_auditEnabled) return
      var _client = _getClientMeta(req)
      var _entry = { server: _auditServer, tool: toolName, args: isMap(toolArgs) ? toolArgs : {} }
      if (isString(_client.ip) && _client.ip.length > 0) _entry.ip = _client.ip
      if (isString(_client.hip) && _client.hip.length > 0) _entry.hip = _client.hip
      if (isString(_client.ua) && _client.ua.length > 0) _entry.ua = _client.ua
      log("[audit] " + af.toSLON(_entry))
    }

    var _readToolsEnv = envName => isDef(getEnv(envName)) ? af.fromJSSLON('{"tools":' + getEnv(envName) + '}').tools : []
    var _toolsInclude = _readToolsEnv("OJOB_MCP_TOOLS_INCLUDE")
    var _toolsExclude = _readToolsEnv("OJOB_MCP_TOOLS_EXCLUDE")
    _$( _toolsInclude, "OJOB_MCP_TOOLS_INCLUDE").isArray().$_("OJOB_MCP_TOOLS_INCLUDE must be a JSON/SLON array")
    _$( _toolsExclude, "OJOB_MCP_TOOLS_EXCLUDE").isArray().$_("OJOB_MCP_TOOLS_EXCLUDE must be a JSON/SLON array")
    _toolsInclude.forEach(n => _$(n, "OJOB_MCP_TOOLS_INCLUDE entry").isString().$_("OJOB_MCP_TOOLS_INCLUDE entries must be strings"))
    _toolsExclude.forEach(n => _$(n, "OJOB_MCP_TOOLS_EXCLUDE entry").isString().$_("OJOB_MCP_TOOLS_EXCLUDE entries must be strings"))

    fns = {}

    var _applyTemplateToDescriptions = meta => _applyTemplate(meta, false)

    var _prefixToolName = n => (isString(args.toolPrefix) && args.toolPrefix.length > 0 ? args.toolPrefix + n : n)
    var _resolveToolName = n => {
      if (isString(args.toolPrefix) && args.toolPrefix.length > 0 && isString(n) && n.startsWith(args.toolPrefix)) {
        return n.substring(args.toolPrefix.length)
      }
      return n
    }
    var _isToolEnabled = f => (_toolsInclude.length == 0 || _toolsInclude.indexOf(f) >= 0) && _toolsExclude.indexOf(f) < 0
    var _toToolMeta = f => {
      var _meta
      if (isDef(args.fnsMeta[f])) {
        _meta = _applyTemplateToDescriptions(clone(args.fnsMeta[f]))
      } else {
        _meta = {
          name       : f,
          description: f,
          inputSchema: {}
        }
      }
      if (!isMap(_meta)) _meta = { name: f, description: String(_meta), inputSchema: {} }
      _meta.name = _prefixToolName(f)
      return _meta
    }

    if (args.usestream) {
      fns[args.uri] = req => {
        try {
          var _rpcFns = {
              initialize                 : params => {
                  if (args.debug) log(`initialize -- ${af.toCSLON(params)}`)
                  return args.description
              },
              "notifications/cancelled"  : params => ({}),
              "notifications/initialized": params => ({}),
              "ping"                     : params => {
                  if (args.debug) log(`ping -- ${af.toCSLON(params)}`)
                  return {}
              },
              "tools/call"               : params => {
                  if (args.debug) log(`tools/call -- ${af.toCSLON(params)}`)
                  var _res
                  var _toolName = _resolveToolName(params.name)
                  _auditLog(_toolName, params.arguments || params.input || {}, req)
                  if (_isToolEnabled(_toolName) && isDef(args.fns[_toolName])) {
                    try {
                      if (isString(args.fns[_toolName])) {
                        _res = $job(args.fns[_toolName], merge({ _httprequest: _scrubAuthHeader(req) }, params.arguments || params.input || {}))
                        if (isMap(_res)) {
                          delete _res.objId
                          delete _res.execid
                          // Check for _err and treat it as an error
                          if (isDef(_res._err)) {
                            var errMsg = _res._err
                            delete _res._err
                            logErr(`Error executing tool '${params.name}': ${errMsg}`)
                            _res = {
                                content: [{
                                    type: "text",
                                    text: String(errMsg)
                                }],
                                isError: true
                            }
                          }
                        }
                      } else {
                        throw "Function not found: " + _toolName
                      }
                    } catch(e) {
                      logErr(`Error executing tool '${params.name}': ${e.message}`)
                      _res = {
                          content: [{
                              type: "text",
                              text: `Error executing tool '${params.name}': ${e.message}`
                          }],
                          isError: true
                      }
                      $err(e)
                    }
                  } else {
                    _res = {
                        content: [{
                            type: "text",
                            text: `Error: Unknown tool '${params.name}'`
                        }],
                        isError: true
                    }
                  }
                  try {
                  if (isDef(_res) && _res.isError !== true && isString(_res.text)) {
                    _res = {
                        content: [{
                            type: "text",
                            text: _res.text
                        }],
                        isError: false
                    }
                  } else if (isDef(_res) && _res.isError !== true && isUnDef(_res.result)) {
                    _res = {
                        content: [{
                            type: "text",
                            text: isDef(__flags.MCPSERVER) && __flags.MCPSERVER.answerInTOON ? af.toTOON(_res) : stringify(_res, __, "")
                        }],
                        isError: false
                    }
                  } else {
                    if (isDef(_res) && _res.isError !== true) _res = _res.result
                  }
                  } catch(eee) { $err(eee) }

                  if (args.debug) log(`tools/call -- response: ${af.toCSLON(_res)}`)
                  return _res
              },
              "tools/list": params => {
                  if (args.debug) log(`tools/list -- ${af.toCSLON(params)}`)
                  var _fnsMeta = Object.keys(args.fns).filter(_isToolEnabled).map(f => _toToolMeta(f))
                  return {
                      tools: _fnsMeta
                  }
              },
              "prompts/list": params => ({})
          }

          // Process the JSON-RPC request
          var _rpcRes = ow.server.httpd.replyJSONRPC(global.__ojobHttp[args.port], req, _rpcFns, log, m => { if (args.debug) print(ansiColor("BG(230),BLACK", m)) })
          
          // Parse request to check if it's a notification
          var body = (isDef(req.files) && isDef(req.files.postData)) ? req.files.postData : __
          if (isUnDef(body) && isDef(req.data)) body = req.data
          
          var reqObj
          try {
            reqObj = jsonParse(body)
          } catch(e) {
            return { data: "Invalid JSON", mimetype: "text/plain", status: 400, header: {} }
          }

          // For notifications (no id field), return 204 No Content immediately
          if (isUnDef(reqObj.id)) {
            if (args.debug) log("Notification received: " + reqObj.method)
            return { data: "", mimetype: "text/plain", status: 204, header: {} }
          }

          // For requests with id, return SSE stream
          var pis = new java.io.PipedInputStream()
          var pos = new java.io.PipedOutputStream(pis)

          $doV(function() {
            try {
              var _payload = _rpcRes
              if (isMap(_rpcRes) && isDef(_rpcRes.data)) _payload = _rpcRes.data
              if (isString(_payload)) {
                try { _payload = jsonParse(_payload) } catch(__e) {}
              }
              
              if (isDef(_payload) && _payload !== "") {
                var msg = "event: message\n"
                msg += "data: " + (isDef(__flags.MCPSERVER) && __flags.MCPSERVER.answerInTOON ? af.toTOON(_payload) : JSON.stringify(_payload)) + "\n\n"
                pos.write(af.fromString2Bytes(msg))
                pos.flush()
              }
            } catch(e) {
              try {
                var errMsg = "event: error\n"
                errMsg += "data: " + JSON.stringify({ message: String(e) }) + "\n\n"
                pos.write(af.fromString2Bytes(errMsg))
                pos.flush()
              } catch(e2) {
                logErr("MCP stream error: " + String(e2))
              }
            } finally {
              try { pos.close() } catch(e) {}
            }
          })

          return {
            status  : 200,
            mimetype: "text/event-stream",
            stream  : pis,
            header  : {
              "Cache-Control"    : "no-cache, no-transform",
              "Connection"       : "keep-alive",
              "Content-Encoding" : "identity",
              "X-Accel-Buffering": "no"
            }
          }
        } catch(e) {
          return { data: String(e), mimetype: "text/plain", status: 500, header: {} }
        }
      }
    } else {
      fns[args.uri] = req => {
        var _rpcFns = {
            initialize                 : params => {
                if (args.debug) log(`initialize -- ${af.toCSLON(params)}`)
                return args.description
            },
            "notifications/cancelled"  : params => ({}),
            "notifications/initialized": params => ({}),
            "ping"                     : params => {
                if (args.debug) log(`ping -- ${af.toCSLON(params)}`)
                return {}
            },
            "tools/call"               : params => {
                if (args.debug) log(`tools/call -- ${af.toCSLON(params)}`)
                var _res
                var _toolName = _resolveToolName(params.name)
                _auditLog(_toolName, params.arguments || params.input || {}, req)
                if (_isToolEnabled(_toolName) && isDef(args.fns[_toolName])) {
                  try {
                    if (isString(args.fns[_toolName])) {
                      _res = $job(args.fns[_toolName], merge({ _httprequest: _scrubAuthHeader(req) }, params.arguments || params.input || {}))
                      if (isMap(_res)) {
                        delete _res.objId
                        delete _res.execid
                        // Check for _err and treat it as an error
                        if (isDef(_res._err)) {
                          var errMsg = _res._err
                          delete _res._err
                          logErr(`Error executing tool '${params.name}': ${errMsg}`)
                          _res = {
                              content: [{
                                  type: "text",
                                  text: String(errMsg)
                              }],
                              isError: true
                          }
                        }
                      }
                    } else {
                      throw "Function not found: " + _toolName
                    }
                  } catch(e) {
                    logErr(`Error executing tool '${params.name}': ${e.message}`)
                    _res = {
                        content: [{
                            type: "text",
                            text: `Error executing tool '${params.name}': ${e.message}`
                        }],
                        isError: true
                    }
                    $err(e)
                  }
                } else {
                  _res = {
                      content: [{
                          type: "text",
                          text: `Error: Unknown tool '${params.name}'`
                      }],
                      isError: true
                  }
                }
                try {
                if (isDef(_res) && _res.isError !== true && isString(_res.text)) {
                  _res = {
                      content: [{
                          type: "text",
                          text: _res.text
                      }],
                      isError: false
                  }
                } else if (isDef(_res) && _res.isError !== true && isUnDef(_res.result)) {
                  _res = {
                      content: [{
                          type: "text",
                          text: (isDef(__flags.MCPSERVER) && __flags.MCPSERVER.answerInTOON ? af.toTOON(_res) : stringify(_res, __, ""))
                      }],
                      isError: false
                  }
                } else {
                  if (isDef(_res) && _res.isError !== true) _res = _res.result
                }
                } catch(eee) { $err(eee) }

                if (args.debug) log(`tools/call -- response: ${af.toCSLON(_res)}`)
                return _res
            },
            "tools/list": params => {
                if (args.debug) log(`tools/list -- ${af.toCSLON(params)}`)
                var _fnsMeta = Object.keys(args.fns).filter(_isToolEnabled).map(f => _toToolMeta(f))
                return {
                    tools: _fnsMeta
                }
            },
            "prompts/list": params => ({})
        }

        return ow.server.httpd.replyJSONRPC(global.__ojobHttp[args.port], req, _rpcFns, log, m => { if (args.debug) print(ansiColor("BG(230),BLACK", m)) })
      }
    }

    // Wraps the MCP endpoint with a bearer-token check when auth is configured; no-op otherwise
    if (_authEnabled) {
      var _innerFn = fns[args.uri]
      fns[args.uri] = req => {
        var _hdr = isMap(req) && isMap(req.header) ? req.header[_authHeader] : __
        var _valid = _authApiEnabled ? _authCheckExternal(_hdr) : _authCheck(_hdr)
        if (!_valid) return _authReject()
        return _innerFn(req)
      }
    }

    // Add handler for .well-known endpoint (optional OAuth discovery)
    /*fns[args.uri + "/.well-known/oauth-authorization-server"] = req => {
      return { data: "{}", mimetype: "application/json", status: 404, header: {} }
    }*/

    ow.server.httpd.route(global.__ojobHttp[args.port], merge(global.__ojobRoutes[args.port], fns))
    log("READY [" + args.port + "]")

# --------------------------
- name    : STDIO MCP Server
  typeArgs:
    noLog   : false 
    shortcut:
      name  : stdioMCP
      keyArg: description
      args  :
        debug      : debug
        tplDesc    : tplDesc
        toolPrefix : toolPrefix
        fnsMeta    : fnsMeta
        fns        : fns
        audit      : audit
  help    :
    text: Starts a MCP stdio to handle requests with execution of jobs.
    expects:
    - name: debug
      desc: (String) If defined it will create a ndjson file with the provided name.
    - name: fnsMeta
      desc: (Map) Metadata for the functions available in the MCP server stdio.
    - name: tplDesc
      desc: (Boolean) If true, all tool description fields in fnsMeta are evaluated as handlebars templates with the current oJob args.
    - name: toolPrefix
      desc: (String) If defined, prefixes exposed MCP tool names without changing fns/fnsMeta key mapping.
    - name: fns
      desc: (Map) Functions to be executed when called from the MCP server stdio.
    - name: audit
      desc: (Boolean) If true (or env OJOB_MCP_AUDIT), logs every tool call (tool name and arguments) via OpenAF's log() function. Default false (no auditing).
  check   :
    in:
      description: isMap.default(__)
      debug      : isString.default(__)
      tplDesc    : toBoolean.isBoolean.default(false)
      toolPrefix : isString.default("")
      fnsMeta    : isMap.default({})
      fns        : isMap.default({})
      audit      : default(__)
  exec    : | #js
    var _applyTemplate = (meta, allStrings) => {
      if (!args.tplDesc) return meta
      var _walk = obj => {
        if (isString(obj) && allStrings) return $t(obj, args)
        if (isArray(obj)) return obj.map(_walk)
        if (isMap(obj)) {
          Object.keys(obj).forEach(k => {
            if (isString(obj[k]) && (allStrings || k == "description")) {
              obj[k] = $t(obj[k], args)
            } else {
              obj[k] = _walk(obj[k])
            }
          })
        }
        return obj
      }
      return _walk(meta)
    }

    // Ensures default server info and capabilities
    args.description = merge({
      protocolVersion: "2024-11-05",
      serverInfo: {
          name: "OpenAF",
          title: "OpenAF server",
          version: "1.0.0"
      },
      capabilities: {
          prompts: {
              listChanged: true
          },
          tools: {
              listChanged: true
          }
      }
    }, args.description)
    args.description = _applyTemplate(clone(args.description), true)

    var _readToolsEnv = envName => isDef(getEnv(envName)) ? af.fromJSSLON('{"tools":' + getEnv(envName) + '}').tools : []
    var _toolsInclude = _readToolsEnv("OJOB_MCP_TOOLS_INCLUDE")
    var _toolsExclude = _readToolsEnv("OJOB_MCP_TOOLS_EXCLUDE")
    _$( _toolsInclude, "OJOB_MCP_TOOLS_INCLUDE").isArray().$_("OJOB_MCP_TOOLS_INCLUDE must be a JSON/SLON array")
    _$( _toolsExclude, "OJOB_MCP_TOOLS_EXCLUDE").isArray().$_("OJOB_MCP_TOOLS_EXCLUDE must be a JSON/SLON array")
    _toolsInclude.forEach(n => _$(n, "OJOB_MCP_TOOLS_INCLUDE entry").isString().$_("OJOB_MCP_TOOLS_INCLUDE entries must be strings"))
    _toolsExclude.forEach(n => _$(n, "OJOB_MCP_TOOLS_EXCLUDE entry").isString().$_("OJOB_MCP_TOOLS_EXCLUDE entries must be strings"))

    // Optional per-tool-call audit logging (opt-in; fails closed/off by default; logs via OpenAF's log() function)
    var _auditEnabled = toBoolean(_$(args.audit).default(getEnv("OJOB_MCP_AUDIT") || "false"))
    var _auditServer  = isMap(args.description) && isMap(args.description.serverInfo) ? args.description.serverInfo.name : "mcp"
    var _auditLog = (toolName, toolArgs) => {
      if (!_auditEnabled) return
      log("[audit] " + af.toSLON({ server: _auditServer, tool: toolName, args: isMap(toolArgs) ? toolArgs : {} }))
    }

    var fs = {}
    var _applyTemplateToDescriptions = meta => _applyTemplate(meta, false)

    var _prefixToolName = n => (isString(args.toolPrefix) && args.toolPrefix.length > 0 ? args.toolPrefix + n : n)
    var _resolveToolName = n => {
      if (isString(args.toolPrefix) && args.toolPrefix.length > 0 && isString(n) && n.startsWith(args.toolPrefix)) {
        return n.substring(args.toolPrefix.length)
      }
      return n
    }
    var _isToolEnabled = f => (_toolsInclude.length == 0 || _toolsInclude.indexOf(f) >= 0) && _toolsExclude.indexOf(f) < 0
    var _toToolMeta = f => {
      var _meta
      if (isDef(args.fnsMeta[f])) {
        _meta = _applyTemplateToDescriptions(clone(args.fnsMeta[f]))
      } else {
        _meta = {
          name       : f,
          description: f,
          inputSchema: {}
        }
      }
      if (!isMap(_meta)) _meta = { name: f, description: String(_meta), inputSchema: {} }
      _meta.name = _prefixToolName(f)
      return _meta
    }

    Object.keys(args.fns).filter(_isToolEnabled).forEach(f => {
      var _toolName = _prefixToolName(f)
      fs[_toolName] = function(params) {
        var _jobName = _resolveToolName(_toolName)
        _auditLog(_jobName, params)
        var _r = $job(args.fns[_jobName], params)
        if (isMap(_r)) {
          delete _r.objId
          delete _r.execid
          // Check for _err and treat it as an error
          if (isDef(_r._err)) {
            var errMsg = _r._err
            delete _r._err
            throw String(errMsg)
          }
        }
        return _r
      }
    })

    ow.server.mcpStdio(args.description, Object.keys(args.fns).filter(_isToolEnabled).map(f => _toToolMeta(f)),
      fs,
      (type, msg) => {
      if (args.debug) {
        io.writeLineNDJSON(args.debug, { type: type, msg: msg })
      }
    })


