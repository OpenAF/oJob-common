# ------------------
- name : HTTP Upload
  deps :
  - HTTP Start Server
  to   : HTTP Service
  typeArgs:
    noLog: false 
    shortcut:
      name  : httpdUpload
      keyArg: port
      args  : 
        uri          : uri
        path         : path
        execURI      : execURI
        audit        : audit
        auditTemplate: auditTemplate
        error        : error
  help :
    text   : Provides a HTTP upload handler. 
    expects:
    - name: port
      desc: (Number) The port where the server was made available (default is 8091)
    - name: uri
      desc: (String) The URI where the HTTP default response will be available (defaults to /upload)
    - name: path
      desc: (String) The local path where uploaded files will be saved
    - name: execURI
      desc: (Function) The URI execution function. Receives a request map and a server object. If doesn't return any value it will proceed to save the file on the corresponding path after code execution.
    - name: audit
      desc: (Boolean) Turns request audit logging on (default true)
    - name: auditTemplate
      desc: (String) Provide an audit logging template based on the request argument.           
    - name: error
      desc: (Boolean) If true will return the error in case of exception.
  args :
    eURI: |
      if (isDef(request.params) && isDef(request.params.data) && request.method == "POST") {
         log("Received file '" + request.params.data + "'...")
         var filename = String(request.params.data)
         if (filename == "." || filename == ".." || /[\/\\\x00]/.test(filename) || /^[a-z]:/i.test(filename) || filename.length == 0) {
           return { data: "Invalid upload filename", mimetype: "text/plain", status: 400, header: {} }
         }
         var destination
         try { destination = global.__ojobHttpResolveFile({{{path}}}, filename) }
         catch(e) { return { data: "Invalid upload destination", mimetype: "text/plain", status: 403, header: {} } }
         io.cp(request.files.data, destination)
         return "ok"
      } else {
         return server.replyOKHTML("<html><body><form enctype=\"multipart/form-data\" method=\"POST\"><input type=\"file\" name=\"data\" value=\"data\" id=\"data\"/><input type=\"submit\" value=\"submit\"/></form></body></html>")
      }
  exec: | #js
      args.path = _$(args.path, "path").default(".")
      args.uri  = _$(args.uri).isString().default("/upload")

      io.mkdir(args.path)
      args.execURI = (isDef(args.execURI) ? args.execURI : "") + "\n" + templify(args.eURI, { path: stringify(String(new java.io.File(args.path).getCanonicalPath()), __, "") })

# -------------------
- name : HTTP Healthz
  deps :
  - HTTP Start Server
  to   : HTTP Service
  typeArgs:
    noLog: false 
    shortcut:
      name  : httpdHealthz
      keyArg: port
      args  : 
        uri        : uri
        path       : path
        healthz    : healthz
        openmetrics: openmetrics
        openMetricsStrict: openMetricsStrict
  help :
   text: Adds a healthz URI
   expects:
   - name: port
     desc: The port of the HTTP Start Server (default to 8091)
   - name: uri
     desc: The uri to use (default /healthz)
   - name: healthz
     desc: A custom function to return the /healthz result (defaults to ow.metrics.getAll with status 200 or "error" with status 500 if an exception is thrown)
   - name: openmetrics
     desc: If openmetrics = true the output will be in openmetrics/prometheus instead of json
   - name: openMetricsStrict
     desc: Strict OpenMetrics 1.0 output (default true); false selects legacy output. Requires the OpenAF strict formatter.
  exec: | #js
      ow.loadMetrics()
      args.port    = _$(args.port).isNumber().default(8091)
      args.uri     = _$(args.uri).isString().default("/healthz")

      args.openMetricsStrict = _$(args.openMetricsStrict).isBoolean().default(true);
      if (args.openmetrics && args.openMetricsStrict && !isString(args.healthz) && !isFunction(ow.metrics._fromObj2OpenMetricsStrict))
        throw new Error("Strict OpenMetrics requires an OpenAF runtime with strict formatter support; use openMetricsStrict: false for legacy output.");
      var s1 = " try { return ow.server.httpd.reply(ow.metrics.getAll()); } catch(e) { return ow.server.httpd.reply(\"error\", 500, void 0, {}); } "
      var s2 = "try { var rrr = server.reply(ow.metrics.fromObj2OpenMetrics(ow.metrics.getAll(), void 0, void 0, void 0, void 0, " + args.openMetricsStrict + "), \"" + (args.openMetricsStrict ? "application/openmetrics-text; version=1.0.0; charset=utf-8" : "text/plain; version=0.0.4; charset=utf-8") + "\", 200, {}); rrr.data = String(rrr.data); return rrr; } catch(e) { logErr(e); return { data: \"error\", status: 500, mimetype: \"text/plain\" }; }";
      args.healthz = _$(args.healthz).isString().default(args.openmetrics ? s2 : s1)
      args.execURI = args.healthz

# ------------------
- name : HTTP Metrics
  deps :
  - HTTP Start Server
  to   : HTTP Service
  typeArgs:
    noLog: false 
    shortcut:
      name  : httpdMetrics
      keyArg: port
      args  : 
        uri    : uri
        metrics: metrics
        prefix : prefix
        helpmap: helpmap
        openMetricsStrict: openMetricsStrict
  help :
   text: Adds a metrics URI with a OpenMetrics/Prometheus output
   expects:
   - name: port
     desc: The port of the HTTP Start Server (default to 8091)
   - name: uri
     desc: The uri to use (default /metrics)
   - name: metrics
     desc: A custom function to return the /metrics result (defaults to ow.metrics.getAll with status 200 or "error" with status 500 if an exception is thrown).
   - name: prefix
     desc: OpenMetrics/Prometheus metrics' name prefix
   - name: helpmap
     desc: OpenMetrics/Prometheus metrics' help map (see help ow.metrics.fromObj2OpenMetrics)
   - name: openMetricsStrict
     desc: Strict OpenMetrics 1.0 output (default true); false selects legacy output. Requires the OpenAF strict formatter.
  exec : | #js
    ow.loadMetrics()
    args.port    = _$(args.port).isNumber().default(8091)
    args.uri     = _$(args.uri).isString().default("/metrics")
    
    args.openMetricsStrict = _$(args.openMetricsStrict).isBoolean().default(true);
    if (args.openMetricsStrict && !isString(args.metrics) && !isFunction(ow.metrics._fromObj2OpenMetricsStrict))
      throw new Error("Strict OpenMetrics requires an OpenAF runtime with strict formatter support; use openMetricsStrict: false for legacy output.");
    args.metrics = _$(args.metrics).isString().default("try { var rrr = server.reply(ow.metrics.fromObj2OpenMetrics((isDef(request.params) && isDef(request.params.s) ? ow.metrics.getSome(request.params.s.split(\",\")) : ow.metrics.getAll()), " + stringify(args.prefix) + ", " + (args.openMetricsStrict ? "void 0" : "now()") + ", " + stringify(args.helpmap, __, "") + ", void 0, " + args.openMetricsStrict + "), \"" + (args.openMetricsStrict ? "application/openmetrics-text; version=1.0.0; charset=utf-8" : "text/plain; version=0.0.4; charset=utf-8") + "\", 200, {}); rrr.data = String(rrr.data); return rrr; } catch(e) { logErr(e); return { data: \"error\", status: 500, mimetype: \"text/plain\" }; }");
    args.execURI = args.metrics

# ----------------------
- name : HTTP Add Metric
  typeArgs:
    noLog: false 
    shortcut:
      name  : httpdAddMetric
      keyArg: metric
      args  : 
        fn: fn
  help : 
   text   : Add a metric to the current daemon execution
   expects:
   - name: metric
     desc: Metric name
   - name: fn 
     desc: Metric function code returning a map
  exec: | #js
    _$(args.metric, "metric").$_()
    _$(args.fn, "fn").$_()
    ow.loadMetrics()
    ow.metrics.add(args.metric, new Function(args.fn))

# Defines an inline markdown response
#
# --------------------
- name : HTTP markdown
  deps :
  - HTTP Start Server
  to   : HTTP Service
  typeArgs:
    noLog: false 
    shortcut:
      name  : httpdMD
      keyArg: port
      args  : 
        uri    : uri
        md     : md
  help :
   text: Adds a markdown URI
   expects:
   - name: port
     desc: The port of the HTTP Start Server (default to 8091)
   - name: uri
     desc: The uri to use (default /metrics)
   - name: md
     desc: The markdown content to be returned
  exec : | #js
    args.port    = _$(Number(args.port)).isNumber().default(8091)
    args.uri     = _$(args.uri).isString().default("/")
    args.md      = _$(args.md).isString().default("You need to provide a markdown content.")

    args.execURI = "try { return server.replyOKHTML(ow.template.parseMD2HTML(`" + args.md.replace(/\`/g, "\\`") + "`, true)) } catch(e) { logErr(e); return { data: \"error\", status: 500, mimetype: \"text/plain\" } }"

